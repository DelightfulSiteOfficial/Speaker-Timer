<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Speaker Timer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0a;
    --surface: #141414;
    --border: #222;
    --text: #f0ede8;
    --muted: #555;
    --accent: #e8ff47;
    --danger: #ff4444;
    --warn: #ff9900;
  }

  html, body {
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    display: flex;
    flex-direction: column;
    min-height: 100dvh;
    padding: env(safe-area-inset-top, 20px) 16px env(safe-area-inset-bottom, 100px);
    gap: 0;
  }

  /* ── Header ── */
  .header {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    padding: 16px 4px 20px;
    flex-shrink: 0;
  }

  .header-left {
    display: flex;
    align-items: center;
  }

  .header-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    letter-spacing: 0.06em;
    color: var(--text);
    text-align: center;
  }

  .header-right {
    display: flex;
    align-items: center;
    justify-content: flex-end;
  }

  .room-count {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  /* ── Empty state ── */
  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    flex: 1;
    padding: 60px 32px;
    text-align: center;
  }

  .empty-icon {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 64px;
    color: var(--border);
    letter-spacing: 0.05em;
  }

  .empty-title {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }

  .empty-sub {
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    color: var(--muted);
    line-height: 1.5;
  }

  /* ── Room cards ── */
  .rooms-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding-bottom: 8px;
  }

  .room-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px 18px;
    cursor: pointer;
    transition: border-color 0.2s, transform 0.1s;
    position: relative;
    overflow: hidden;
    text-decoration: none;
    display: block;
    color: inherit;
    -webkit-tap-highlight-color: transparent;
  }

  .room-card:active { transform: scale(0.98); }
  .room-card.running { border-color: #2a2e14; }
  .room-card.offline { opacity: 0.5; }

  .card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .card-session-id {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    color: var(--accent);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  .card-session-id:active { opacity: 0.6; }

  .card-status-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .card-pill {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 3px 9px;
    border-radius: 100px;
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    border: 1px solid var(--border);
    color: var(--muted);
  }

  .card-pill.running { border-color: var(--accent); color: var(--accent); }
  .card-pill.paused  { border-color: var(--warn);   color: var(--warn); }
  .card-pill.offline { border-color: var(--border);  color: var(--muted); }

  .pill-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: currentColor;
  }

  .pill-dot.live { animation: pulse 2s ease-in-out infinite; }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .card-body {
    display: flex;
    align-items: baseline;
    gap: 16px;
    margin-bottom: 8px;
  }

  .card-time {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 52px;
    line-height: 1;
    letter-spacing: -0.01em;
    font-variant-numeric: tabular-nums;
    color: var(--text);
    transition: color 0.4s;
    flex-shrink: 0;
  }

  .card-time.warning { color: var(--warn); }
  .card-time.danger  { color: var(--danger); }
  .card-time.overtime { color: var(--danger); }

  .card-info {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 4px;
    overflow: hidden;
  }

  .card-speaker {
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 400;
    color: rgba(240,237,232,0.6);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .card-speaker.empty { color: var(--muted); font-style: italic; }

  .card-meta {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .card-meta .waiting { color: var(--warn); }

  .card-progress {
    height: 2px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
    margin-top: 4px;
  }

  .card-progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    transition: width 1s linear, background 0.5s;
  }

  .card-progress-fill.warning { background: var(--warn); }
  .card-progress-fill.danger  { background: var(--danger); }

  .card-remove {
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 16px;
    cursor: pointer;
    border-radius: 50%;
    flex-shrink: 0;
    transition: all 0.15s;
  }

  .card-remove:active { background: var(--border); color: var(--danger); }

  /* ── QR modal ── */
  .qr-modal {
    position: fixed; inset: 0;
    background: rgba(10,10,10,0.92);
    display: flex; align-items: center; justify-content: center;
    z-index: 210;
    opacity: 0; pointer-events: none;
    transition: opacity 0.2s;
  }
  .qr-modal.visible { opacity: 1; pointer-events: auto; }

  .qr-modal-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 28px 24px 20px;
    width: calc(100% - 40px);
    max-width: 340px;
    display: flex; flex-direction: column; align-items: center; gap: 14px;
  }

  .qr-modal-eyebrow {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--muted);
    align-self: flex-start;
  }

  .qr-code-wrap {
    background: #fff;
    border-radius: 14px;
    padding: 14px;
    width: 210px; height: 210px;
    display: flex; align-items: center; justify-content: center;
  }

  .qr-modal-session {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 40px;
    letter-spacing: 0.1em;
    color: var(--accent);
  }

  .qr-modal-url {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.06em;
    color: var(--muted);
    text-align: center;
    word-break: break-all;
  }

  .qr-modal-close {
    width: 100%;
    height: 48px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.15s;
  }
  .qr-modal-close:active { background: var(--border); color: var(--text); }

  /* ── Start Fresh button ── */
  .btn-fresh {
    background: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 5px 8px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.15s;
    min-height: 28px;
    font-size: 9px;
  }
  .btn-fresh:active { background: var(--border); color: var(--text); }

  /* ── Confirm modal ── */
  .confirm-modal {
    position: fixed; inset: 0;
    background: rgba(10,10,10,0.9);
    display: flex; align-items: center; justify-content: center;
    z-index: 200;
    opacity: 0; pointer-events: none;
    transition: opacity 0.2s;
    padding: 24px;
  }
  .confirm-modal.visible { opacity: 1; pointer-events: auto; }

  .confirm-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 28px 24px 24px;
    width: 100%;
    max-width: 340px;
    display: flex; flex-direction: column; gap: 16px;
  }

  .confirm-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 36px;
    letter-spacing: 0.04em;
    color: var(--text);
    line-height: 1;
  }

  .confirm-body {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    color: var(--muted);
    line-height: 1.7;
  }

  .confirm-actions { display: flex; flex-direction: column; gap: 8px; }

  .btn-confirm-yes {
    width: 100%; height: 52px;
    border-radius: 12px; border: none;
    background: var(--danger);
    color: #fff;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 24px; letter-spacing: 0.06em;
    cursor: pointer; transition: all 0.15s;
  }
  .btn-confirm-yes:active { opacity: 0.8; transform: scale(0.97); }

  .btn-confirm-no {
    width: 100%; height: 44px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: none;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase;
    cursor: pointer; transition: all 0.15s;
  }
  .btn-confirm-no:active { background: var(--border); color: var(--text); }

  /* ── Add room FAB ── */
  .fab {
    position: fixed;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 24px);
    right: 20px;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: var(--accent);
    border: none;
    color: #000;
    font-size: 28px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 20px rgba(232,255,71,0.3);
    transition: transform 0.15s;
    z-index: 50;
  }

  .fab:active { transform: scale(0.92); }

  /* ── Add room sheet ── */
  .sheet-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 60;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s;
  }

  .sheet-backdrop.visible { opacity: 1; pointer-events: all; }

  .sheet {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--surface);
    border-top: 1px solid var(--border);
    border-radius: 20px 20px 0 0;
    padding: 20px 20px calc(env(safe-area-inset-bottom, 0px) + 28px);
    z-index: 70;
    transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .sheet.visible { transform: translateY(0); }

  .sheet-handle {
    width: 36px;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin: 0 auto 8px;
  }

  .sheet-title {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    text-align: center;
  }

  .sheet-input-row {
    display: flex;
    gap: 10px;
  }

  .session-input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 18px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    outline: none;
    transition: border-color 0.2s;
  }

  .session-input::placeholder {
    color: var(--muted);
    font-size: 13px;
    letter-spacing: 0.1em;
    text-transform: none;
  }

  .session-input:focus { border-color: var(--accent); }

  .btn-add-confirm {
    background: var(--accent);
    border: none;
    border-radius: 12px;
    padding: 14px 20px;
    color: #000;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 0.06em;
    cursor: pointer;
    flex-shrink: 0;
    transition: all 0.15s;
  }

  .btn-add-confirm:active { transform: scale(0.95); }

  .btn-scan-qr {
    width: 100%;
    background: none;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .btn-scan-qr:active { background: var(--border); }

  .sheet-error {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--danger);
    letter-spacing: 0.1em;
    text-align: center;
    min-height: 1.4em;
  }

  /* ── QR scanner ── */
  .qr-scanner {
    display: none;
    flex-direction: column;
    gap: 10px;
  }

  .qr-scanner.visible { display: flex; }

  #qrVideo {
    width: 100%;
    border-radius: 12px;
    background: #000;
    aspect-ratio: 1;
    object-fit: cover;
  }

  .btn-cancel-scan {
    background: none;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    cursor: pointer;
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <button class="btn-fresh" id="freshBtn">Start Fresh</button>
  </div>
  <div class="header-title">Speaker Timer</div>
  <div class="header-right">
    <div class="room-count" id="roomCount"></div>
  </div>
</div>

<!-- ── Start Fresh confirmation ── -->
<div class="confirm-modal" id="confirmModal">
  <div class="confirm-box">
    <div class="confirm-title">Start Fresh?</div>
    <div class="confirm-body">This will remove all rooms from your list and reset your name. You'll be taken back to the setup screen.</div>
    <div class="confirm-actions">
      <button class="btn-confirm-yes" id="confirmYes">Yes, Clear Everything</button>
      <button class="btn-confirm-no" id="confirmNo">Cancel</button>
    </div>
  </div>
</div>

<div class="empty-state" id="emptyState">
  <div class="empty-icon">--:--</div>
  <div class="empty-title">No rooms added</div>
  <div class="empty-sub">Tap + to add a room by entering<br>its session ID or scanning its QR code</div>
</div>

<div class="rooms-list" id="roomsList"></div>

<button class="fab" id="fabBtn">+</button>

<div class="sheet-backdrop" id="sheetBackdrop"></div>
<div class="sheet" id="sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-title">Add Room</div>

  <div class="sheet-input-row">
    <input class="session-input" id="sessionInput" type="text" placeholder="Session ID (e.g. ROOMA)" maxlength="10" autocomplete="off" autocorrect="off" spellcheck="false">
    <button class="btn-add-confirm" id="addConfirmBtn">Add</button>
  </div>

  <button class="btn-scan-qr" id="scanQrBtn">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 14h3v3M17 20h3M20 17v3"/></svg>
    Scan QR Code
  </button>

  <div class="qr-scanner" id="qrScanner">
    <video id="qrVideo" playsinline autoplay muted></video>
    <canvas id="qrCanvas" style="display:none"></canvas>
    <button class="btn-cancel-scan" id="cancelScanBtn">Cancel Scan</button>
  </div>

  <div class="sheet-error" id="sheetError"></div>
</div>

<!-- ── QR code modal ── -->
<div class="qr-modal" id="qrModal">
  <div class="qr-modal-box">
    <div class="qr-modal-eyebrow">Scan to Control</div>
    <div class="qr-code-wrap" id="qrCodeWrap"></div>
    <div class="qr-modal-session" id="qrModalSession"></div>
    <div class="qr-modal-url" id="qrModalUrl"></div>
    <button class="qr-modal-close" id="qrModalClose">Close</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
  const SERVER_URL = window.SPEAKER_TIMER_SERVER || 'wss://speaker-timer-production.up.railway.app';
  const STORAGE_KEY = 'speakerTimerRooms';

  // ── QR modal ─────────────────────────────────────────────────────────────────
  const qrModal   = document.getElementById('qrModal');
  const qrCodeWrap = document.getElementById('qrCodeWrap');

  function openQrModal(sessionId) {
    const controlUrl = `${window.location.origin}/control/?session=${sessionId}`;
    document.getElementById('qrModalSession').textContent = sessionId;
    document.getElementById('qrModalUrl').textContent = controlUrl;
    qrCodeWrap.innerHTML = '';
    new QRCode(qrCodeWrap, {
      text: controlUrl,
      width: 182, height: 182,
      colorDark: '#000000', colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.M,
    });
    qrModal.classList.add('visible');
  }

  document.getElementById('qrModalClose').addEventListener('click', () => qrModal.classList.remove('visible'));
  qrModal.addEventListener('click', e => { if (e.target === qrModal) qrModal.classList.remove('visible'); });

  // ── Start Fresh ──────────────────────────────────────────────────────────────
  const confirmModal = document.getElementById('confirmModal');
  document.getElementById('freshBtn').addEventListener('click', () => {
    confirmModal.classList.add('visible');
  });
  document.getElementById('confirmNo').addEventListener('click', () => {
    confirmModal.classList.remove('visible');
  });
  confirmModal.addEventListener('click', e => {
    if (e.target === confirmModal) confirmModal.classList.remove('visible');
  });
  document.getElementById('confirmYes').addEventListener('click', () => {
    // Close all open WebSocket connections
    Object.values(roomData).forEach(entry => {
      try { entry.ws?.close(); } catch {}
    });
    // Clear all localStorage keys used by this app
    localStorage.removeItem(STORAGE_KEY);
    localStorage.removeItem('speakerTimerMyName');
    localStorage.removeItem('speakerTimerNamePromptSeen');
    // Send to control page — name prompt will appear since keys are cleared
    window.location.href = '/control/';
  });

  // ── Room list (persisted in localStorage) ────────────────────────────────────
  function loadRooms() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
    catch { return []; }
  }

  function saveRooms(rooms) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(rooms));
  }

  let rooms = loadRooms(); // array of session ID strings

  // ── Live state per room ───────────────────────────────────────────────────────
  // roomData[sessionId] = { state, ws, status: 'connecting'|'live'|'offline' }
  const roomData = {};

  function connectRoom(sessionId) {
    if (roomData[sessionId]?.ws?.readyState === WebSocket.OPEN) return;

    const entry = roomData[sessionId] || {};
    entry.status = 'connecting';
    entry.state  = entry.state || { running: false, timeRemaining: 0, totalTime: 0, roomName: '', overtime: false, waitingList: [], runCount: 0 };
    roomData[sessionId] = entry;

    try {
      const ws = new WebSocket(`${SERVER_URL}?session=${sessionId}&role=view`);
      entry.ws = ws;

      ws.onopen = () => {
        entry.status = 'live';
        renderCard(sessionId);
      };

      ws.onmessage = (e) => {
        try {
          const msg = JSON.parse(e.data);
          if (msg.type === 'state') {
            entry.state = { ...entry.state, ...msg.payload };
            renderCard(sessionId);
          }
        } catch {}
      };

      ws.onclose = () => {
        entry.status = 'offline';
        renderCard(sessionId);
        setTimeout(() => {
          if (rooms.includes(sessionId)) connectRoom(sessionId);
        }, 4000);
      };

      ws.onerror = () => ws.close();

    } catch {
      entry.status = 'offline';
    }
  }

  function disconnectRoom(sessionId) {
    const entry = roomData[sessionId];
    if (entry?.ws) { entry.ws.onclose = null; entry.ws.close(); }
    delete roomData[sessionId];
  }

  // ── Format helpers ────────────────────────────────────────────────────────────
  function formatTime(seconds) {
    if (!Number.isFinite(seconds)) return '--:--';
    const abs = Math.abs(seconds);
    const m   = Math.floor(abs / 60);
    const s   = abs % 60;
    return `${seconds < 0 ? '-' : ''}${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  }

  function timeClass(tr, overtime) {
    if (overtime)  return 'overtime';
    if (tr <= 30)  return 'danger';
    if (tr <= 60)  return 'warning';
    return '';
  }

  // ── Render a single card ──────────────────────────────────────────────────────
  function renderCard(sessionId) {
    const el = document.getElementById(`card-${sessionId}`);
    if (!el) return;

    const { state, status } = roomData[sessionId] || {};
    const { running, timeRemaining, totalTime, roomName, overtime, waitingList = [], runCount = 0 } = state || {};
    const offline = status === 'offline' || status === 'connecting';
    const tc = offline ? '' : timeClass(timeRemaining, overtime);
    const pct = totalTime > 0 ? Math.max(0, timeRemaining / totalTime) * 100 : 100;

    const pillClass = offline ? 'offline' : running ? 'running' : 'paused';
    const pillLabel = offline ? (status === 'connecting' ? 'Connecting' : 'Offline') : running ? 'Running' : (overtime ? 'Overtime' : 'Paused');

    const waitingCount = waitingList?.length || 0;
    const metaParts = [];
    if (!offline && runCount > 0) metaParts.push(`Timer ${runCount + 1}`);
    if (!offline && waitingCount > 0) metaParts.push(`<span class="waiting">${waitingCount} waiting</span>`);

    el.className = `room-card ${running && !offline ? 'running' : ''} ${offline ? 'offline' : ''}`;

    el.innerHTML = `
      <div class="card-top">
        <div class="card-session-id card-session-qr" data-id="${sessionId}">${sessionId} ↗</div>
        <div class="card-status-row">
          <div class="card-pill ${pillClass}">
            <span class="pill-dot ${running && !offline ? 'live' : ''}"></span>
            ${pillLabel}
          </div>
          <button class="card-remove" data-id="${sessionId}" title="Remove room">×</button>
        </div>
      </div>
      <div class="card-body">
        <div class="card-time ${tc}">${offline ? '--:--' : formatTime(timeRemaining)}</div>
        <div class="card-info">
          <div class="card-speaker ${roomName ? '' : 'empty'}">${roomName || 'No room name'}</div>
          ${metaParts.length ? `<div class="card-meta">${metaParts.join(' · ')}</div>` : ''}
        </div>
      </div>
      <div class="card-progress">
        <div class="card-progress-fill ${tc}" style="width:${offline ? '100' : pct}%"></div>
      </div>
    `;

    // Remove button
    el.querySelector('.card-remove').addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
      removeRoom(sessionId);
    });

    // Session ID tap → QR modal
    el.querySelector('.card-session-qr').addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
      openQrModal(sessionId);
    });
  }

  // ── Render full rooms list ────────────────────────────────────────────────────
  function renderRooms() {
    const list = document.getElementById('roomsList');
    const empty = document.getElementById('emptyState');
    const count = document.getElementById('roomCount');

    if (rooms.length === 0) {
      empty.style.display = '';
      list.style.display = 'none';
      count.textContent = '';
    } else {
      empty.style.display = 'none';
      list.style.display = '';
      count.textContent = `${rooms.length} room${rooms.length !== 1 ? 's' : ''}`;

      // Add missing cards, remove extra ones
      const existing = new Set([...list.querySelectorAll('.room-card')].map(el => el.dataset.id));

      rooms.forEach(id => {
        if (!existing.has(id)) {
          const card = document.createElement('a');
          card.id = `card-${id}`;
          card.dataset.id = id;
          card.href = `/control/?session=${id}`;
          list.appendChild(card);
          renderCard(id);
        }
      });

      [...list.querySelectorAll('.room-card')].forEach(el => {
        if (!rooms.includes(el.dataset.id)) el.remove();
      });
    }
  }

  // ── Add / remove rooms ────────────────────────────────────────────────────────
  function addRoom(sessionId) {
    sessionId = sessionId.toUpperCase().trim();
    if (!sessionId) return 'Enter a session ID';
    if (rooms.includes(sessionId)) return 'Room already added';
    rooms.push(sessionId);
    saveRooms(rooms);
    connectRoom(sessionId);
    renderRooms();
    return null; // no error
  }

  function removeRoom(sessionId) {
    rooms = rooms.filter(id => id !== sessionId);
    saveRooms(rooms);
    disconnectRoom(sessionId);
    document.getElementById(`card-${sessionId}`)?.remove();
    renderRooms();
  }

  // ── Sheet (add room UI) ───────────────────────────────────────────────────────
  const sheet         = document.getElementById('sheet');
  const backdrop      = document.getElementById('sheetBackdrop');
  const sessionInput  = document.getElementById('sessionInput');
  const sheetError    = document.getElementById('sheetError');
  const qrScanner     = document.getElementById('qrScanner');

  function openSheet() {
    sheet.classList.add('visible');
    backdrop.classList.add('visible');
    sheetError.textContent = '';
    setTimeout(() => sessionInput.focus(), 350);
  }

  function closeSheet() {
    sheet.classList.remove('visible');
    backdrop.classList.remove('visible');
    sessionInput.value = '';
    sheetError.textContent = '';
    stopScan();
  }

  document.getElementById('fabBtn').addEventListener('click', openSheet);
  backdrop.addEventListener('click', closeSheet);

  document.getElementById('addConfirmBtn').addEventListener('click', () => {
    const err = addRoom(sessionInput.value);
    if (err) { sheetError.textContent = err; return; }
    closeSheet();
  });

  sessionInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') document.getElementById('addConfirmBtn').click();
  });

  // ── QR scanner ───────────────────────────────────────────────────────────────
  let scanStream = null;
  let scanAnimFrame = null;

  async function startScan() {
    qrScanner.classList.add('visible');
    sheetError.textContent = '';

    try {
      scanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
      const video = document.getElementById('qrVideo');
      video.srcObject = scanStream;
      video.play();
      scanFrame();
    } catch {
      sheetError.textContent = 'Camera access denied';
      qrScanner.classList.remove('visible');
    }
  }

  function scanFrame() {
    const video  = document.getElementById('qrVideo');
    const canvas = document.getElementById('qrCanvas');

    if (video.readyState === video.HAVE_ENOUGH_DATA) {
      canvas.width  = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const code = jsQR(imageData.data, imageData.width, imageData.height);

      if (code) {
        // Extract session ID from URL or use raw value
        let sessionId = code.data;
        try {
          const url = new URL(code.data);
          const param = new URLSearchParams(url.search).get('session');
          if (param) sessionId = param;
        } catch {}

        stopScan();
        const err = addRoom(sessionId);
        if (err) { sheetError.textContent = err; return; }
        closeSheet();
        return;
      }
    }

    scanAnimFrame = requestAnimationFrame(scanFrame);
  }

  function stopScan() {
    if (scanAnimFrame) { cancelAnimationFrame(scanAnimFrame); scanAnimFrame = null; }
    if (scanStream) { scanStream.getTracks().forEach(t => t.stop()); scanStream = null; }
    qrScanner.classList.remove('visible');
  }

  document.getElementById('scanQrBtn').addEventListener('click', startScan);
  document.getElementById('cancelScanBtn').addEventListener('click', stopScan);

  // ── Boot ──────────────────────────────────────────────────────────────────────
  renderRooms();
  rooms.forEach(connectRoom);
</script>
</body>
</html>
