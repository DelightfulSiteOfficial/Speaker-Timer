<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Speaker Timer — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0a;
    --surface: #111111;
    --border: #1e1e1e;
    --text: #f0ede8;
    --muted: #555;
    --accent: #e8ff47;
    --danger: #ff4444;
    --warn: #ff9900;
  }

  html, body {
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
  }

  body {
    padding: 32px;
  }

  /* ── Header ── */
  .page-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 32px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 20px;
  }

  .page-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 32px;
    letter-spacing: 0.05em;
    color: var(--text);
  }

  .page-meta {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }

  /* ── Session grid ── */
  .sessions-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
  }

  .empty-state {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    text-align: center;
    padding: 80px 0;
    grid-column: 1 / -1;
  }

  /* ── Session card ── */
  .session-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    transition: border-color 0.3s;
  }

  .session-card.running {
    border-color: #2a2e14;
  }

  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .session-id {
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    color: var(--accent);
    letter-spacing: 0.15em;
  }

  .status-pill {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border-radius: 100px;
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    border: 1px solid var(--border);
    color: var(--muted);
  }

  .status-pill.running { border-color: var(--accent); color: var(--accent); }
  .status-pill.paused  { border-color: var(--warn);   color: var(--warn); }

  .pill-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: currentColor;
  }

  .pill-dot.live { animation: pulse 2s ease-in-out infinite; }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .card-time {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 56px;
    line-height: 1;
    letter-spacing: -0.01em;
    font-variant-numeric: tabular-nums;
    color: var(--text);
    transition: color 0.4s;
  }

  .card-time.warning { color: var(--warn); }
  .card-time.danger  { color: var(--danger); }
  .card-time.overtime { color: var(--danger); }

  .progress-bar {
    height: 2px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    transition: width 1s linear, background 0.5s;
  }

  .progress-fill.warning { background: var(--warn); }
  .progress-fill.danger  { background: var(--danger); }

  .card-speaker {
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 300;
    color: var(--muted);
    min-height: 1.4em;
  }

  .card-speaker.has-name { color: rgba(240,237,232,0.7); }

  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 10px;
    border-top: 1px solid var(--border);
  }

  .card-clients {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .card-waiting {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .card-waiting.has-waiting { color: var(--warn); }

  .card-open-btn {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    text-decoration: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 10px;
    transition: all 0.15s;
  }

  .card-open-btn:hover { border-color: var(--muted); color: var(--text); }

  .card-qr-btn {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    background: rgba(232,255,71,0.06);
    border: 1px solid rgba(232,255,71,0.3);
    border-radius: 6px;
    padding: 4px 10px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .card-qr-btn:hover { background: rgba(232,255,71,0.12); border-color: var(--accent); }

  /* ── QR modal ── */
  .qr-modal {
    position: fixed; inset: 0;
    background: rgba(10,10,10,0.92);
    display: flex; align-items: center; justify-content: center;
    z-index: 210;
    opacity: 0; pointer-events: none;
    transition: opacity 0.2s;
  }
  .qr-modal.visible { opacity: 1; pointer-events: auto; }

  .qr-modal-box {
    background: #141414;
    border: 1px solid #2a2a2a;
    border-radius: 24px;
    padding: 32px 28px 24px;
    width: calc(100% - 48px);
    max-width: 340px;
    display: flex; flex-direction: column; align-items: center; gap: 16px;
  }

  .qr-modal-eyebrow {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--muted);
    align-self: flex-start;
  }

  .qr-code-wrap {
    background: #fff;
    border-radius: 16px;
    padding: 16px;
    width: 220px; height: 220px;
    display: flex; align-items: center; justify-content: center;
  }

  .qr-session-id {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 36px;
    letter-spacing: 0.1em;
    color: var(--accent);
    text-align: center;
  }

  .qr-session-url {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.08em;
    color: var(--muted);
    text-align: center;
    word-break: break-all;
  }

  .qr-modal-close {
    width: 100%;
    height: 48px;
    border-radius: 12px;
    border: 1px solid #2a2a2a;
    background: transparent;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.15s;
    margin-top: 4px;
  }
  .qr-modal-close:hover { background: #1e1e1e; color: var(--text); }

  /* ── Release control button ── */
  .card-release-btn {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--warn);
    background: none;
    border: 1px solid rgba(255,153,0,0.3);
    border-radius: 6px;
    padding: 4px 10px;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .card-release-btn:hover { background: rgba(255,153,0,0.08); border-color: var(--warn); }

  /* ── Release modal ── */
  .release-modal {
    position: fixed; inset: 0;
    background: rgba(10,10,10,0.88);
    display: flex; align-items: center; justify-content: center;
    z-index: 200;
    opacity: 0; pointer-events: none;
    transition: opacity 0.2s;
  }
  .release-modal.visible { opacity: 1; pointer-events: auto; }

  .release-modal-box {
    background: #141414;
    border: 1px solid #222;
    border-radius: 20px;
    padding: 24px 20px 20px;
    width: calc(100% - 40px);
    max-width: 400px;
    display: flex; flex-direction: column; gap: 14px;
  }

  .release-modal-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 26px;
    letter-spacing: 0.05em;
    color: var(--text);
  }

  .release-modal-sub {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: -8px;
  }

  .release-waiting-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .release-waiting-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--surface);
    border: 1px solid #222;
    border-radius: 12px;
    padding: 12px 16px;
    gap: 12px;
  }

  .release-waiting-name {
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    color: var(--text);
    flex: 1;
  }

  .release-waiting-name.unnamed { color: var(--muted); font-style: italic; }

  .btn-pass-to {
    background: transparent;
    border: 1px solid var(--accent);
    border-radius: 8px;
    padding: 6px 14px;
    color: var(--accent);
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .btn-pass-to:hover { background: rgba(232,255,71,0.08); }

  .release-modal-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    padding-top: 4px;
    border-top: 1px solid #1e1e1e;
  }

  .btn-just-release {
    height: 48px;
    border-radius: 12px;
    border: 1px solid rgba(255,153,0,0.4);
    background: transparent;
    color: var(--warn);
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-just-release:hover { background: rgba(255,153,0,0.08); border-color: var(--warn); }

  .btn-release-cancel {
    height: 48px;
    border-radius: 12px;
    border: 1px solid #222;
    background: transparent;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-release-cancel:hover { background: #1e1e1e; color: var(--text); }

  /* ── Controller info ── */
  .controller-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .controller-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--muted);
    flex-shrink: 0;
  }

  .controller-dot.connected { background: var(--accent); }

  /* ── Waiting names list ── */
  .waiting-names {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .waiting-tag {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--warn);
    border: 1px solid rgba(255,153,0,0.3);
    border-radius: 6px;
    padding: 3px 8px;
    letter-spacing: 0.08em;
  }
</style>
</head>
<body>

<div class="page-header">
  <div class="page-title">Admin — All Sessions</div>
  <div class="page-meta" id="pollStatus">Connecting…</div>
</div>

<div class="sessions-grid" id="sessionsGrid">
  <div class="empty-state">No active sessions</div>
</div>

<!-- ── QR code modal ── -->
<div class="qr-modal" id="qrModal">
  <div class="qr-modal-box">
    <div class="qr-modal-eyebrow">Scan to Control</div>
    <div class="qr-code-wrap" id="qrCodeWrap"></div>
    <div class="qr-session-id" id="qrSessionId"></div>
    <div class="qr-session-url" id="qrSessionUrl"></div>
    <button class="qr-modal-close" id="qrModalClose">Close</button>
  </div>
</div>

<!-- ── Release control modal ── -->
<div class="release-modal" id="releaseModal">
  <div class="release-modal-box">
    <div class="release-modal-title" id="releaseModalTitle">Release Control</div>
    <div class="release-modal-sub" id="releaseModalSub">No one waiting</div>
    <div class="release-waiting-list" id="releaseWaitingList"></div>
    <div class="release-modal-actions">
      <button class="btn-just-release" id="btnJustRelease">Release</button>
      <button class="btn-release-cancel" id="btnReleaseCancel">Cancel</button>
    </div>
  </div>
</div>

<script>
  const SERVER_URL = window.SPEAKER_TIMER_SERVER || 'wss://speaker-timer-production.up.railway.app';
  const HTTP_URL = SERVER_URL.replace(/^wss?:\/\//, 'https://').replace(/^ws:\/\//, 'http://');

  const grid       = document.getElementById('sessionsGrid');
  const pollStatus = document.getElementById('pollStatus');

  function formatTime(seconds) {
    if (!Number.isFinite(seconds)) return '--:--';
    const abs = Math.abs(seconds);
    const m = Math.floor(abs / 60);
    const s = abs % 60;
    const sign = seconds < 0 ? '-' : '';
    return `${sign}${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  }

  function timeClass(timeRemaining, overtime) {
    if (overtime) return 'overtime';
    if (timeRemaining <= 30) return 'danger';
    if (timeRemaining <= 60) return 'warning';
    return '';
  }

  function renderSessions(sessions) {
    if (!sessions.length) {
      grid.innerHTML = '<div class="empty-state">No active sessions</div>';
      return;
    }

    grid.innerHTML = sessions.map(({ id, state, clientCount }) => {
      const { running, timeRemaining, totalTime, speakerName, overtime, controllerConnected, waitingList = [] } = state;
      const pct = totalTime > 0 ? Math.max(0, timeRemaining / totalTime) * 100 : 100;
      const tc = timeClass(timeRemaining, overtime);
      const displayUrl = `${window.location.origin}/display/?session=${id}`;

      return `
        <div class="session-card ${running ? 'running' : ''}">
          <div class="card-header">
            <div class="session-id">${id}</div>
            <div class="status-pill ${running ? 'running' : 'paused'}">
              <span class="pill-dot ${running ? 'live' : ''}"></span>
              ${running ? 'Running' : (overtime ? 'Overtime' : 'Paused')}
            </div>
          </div>

          <div class="card-time ${tc}">${formatTime(timeRemaining)}</div>

          <div class="progress-bar">
            <div class="progress-fill ${tc}" style="width:${pct}%"></div>
          </div>

          <div class="card-speaker ${speakerName ? 'has-name' : ''}">${speakerName || 'No speaker set'}</div>

          <div class="controller-row">
            <span class="controller-dot ${controllerConnected ? 'connected' : ''}"></span>
            ${controllerConnected ? 'Controller connected' : 'No controller'}
            ${controllerConnected ? `<button class="card-release-btn" data-session="${id}" data-waiting='${JSON.stringify(waitingList)}'>Release Control</button>` : ''}
          </div>

          ${waitingList.length > 0 ? `
            <div class="waiting-names">
              ${waitingList.map(w => `<span class="waiting-tag">${w.name || 'Unknown'}</span>`).join('')}
            </div>
          ` : ''}

          <div class="card-footer">
            <span class="card-clients">${clientCount} client${clientCount !== 1 ? 's' : ''}</span>
            <button class="card-qr-btn" data-session="${id}">QR Code</button>
            <a class="card-open-btn" href="${displayUrl}" target="_blank">Open Display ↗</a>
          </div>
        </div>
      `;
    }).join('');
  }

  async function poll() {
    try {
      const res = await fetch(`${HTTP_URL}/sessions`);
      const { sessions } = await res.json();
      renderSessions(sessions);
      pollStatus.textContent = `Updated ${new Date().toLocaleTimeString()}`;
    } catch (e) {
      pollStatus.textContent = 'Error reaching server';
    }
  }

  // ── Release modal ─────────────────────────────────────────────────────────
  const releaseModal      = document.getElementById('releaseModal');
  const releaseModalTitle = document.getElementById('releaseModalTitle');
  const releaseModalSub   = document.getElementById('releaseModalSub');
  const releaseWaitingList = document.getElementById('releaseWaitingList');
  const btnJustRelease    = document.getElementById('btnJustRelease');
  const btnReleaseCancel  = document.getElementById('btnReleaseCancel');

  let modalSessionId = null;

  function openReleaseModal(sessionId, waitingList) {
    modalSessionId = sessionId;
    releaseModalTitle.textContent = `Release Control — ${sessionId}`;

    if (waitingList.length > 0) {
      releaseModalSub.textContent = `${waitingList.length} device${waitingList.length !== 1 ? 's' : ''} waiting — pass to one or just release`;
      releaseWaitingList.innerHTML = waitingList.map(w => `
        <div class="release-waiting-item">
          <span class="release-waiting-name ${w.name ? '' : 'unnamed'}">${w.name || 'Unknown device'}</span>
          <button class="btn-pass-to" data-target="${w.id}">Pass control →</button>
        </div>
      `).join('');
      releaseWaitingList.style.display = '';
    } else {
      releaseModalSub.textContent = 'No one waiting — control will be freed.';
      releaseWaitingList.innerHTML = '';
      releaseWaitingList.style.display = 'none';
    }

    releaseModal.classList.add('visible');
  }

  function closeReleaseModal() {
    releaseModal.classList.remove('visible');
    modalSessionId = null;
  }

  // Pass to a waiting person
  releaseWaitingList.addEventListener('click', async (e) => {
    const btn = e.target.closest('.btn-pass-to');
    if (!btn || !modalSessionId) return;
    const targetId = btn.dataset.target;
    btn.textContent = '…';
    btn.disabled = true;
    try {
      await fetch(`${HTTP_URL}/sessions/${modalSessionId}/pass`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ targetId }),
      });
    } catch {}
    closeReleaseModal();
    poll();
  });

  // Just release with no handoff
  btnJustRelease.addEventListener('click', async () => {
    if (!modalSessionId) return;
    btnJustRelease.textContent = '…';
    btnJustRelease.disabled = true;
    try {
      await fetch(`${HTTP_URL}/sessions/${modalSessionId}/release`, { method: 'POST' });
    } catch {}
    closeReleaseModal();
    btnJustRelease.textContent = 'Release';
    btnJustRelease.disabled = false;
    poll();
  });

  btnReleaseCancel.addEventListener('click', closeReleaseModal);
  releaseModal.addEventListener('click', (e) => { if (e.target === releaseModal) closeReleaseModal(); });

  // Open release modal via event delegation
  grid.addEventListener('click', (e) => {
    const releaseBtn = e.target.closest('.card-release-btn');
    if (releaseBtn) {
      openReleaseModal(releaseBtn.dataset.session, JSON.parse(releaseBtn.dataset.waiting || '[]'));
      return;
    }
    const qrBtn = e.target.closest('.card-qr-btn');
    if (qrBtn) openQrModal(qrBtn.dataset.session);
  });

  // ── QR modal ─────────────────────────────────────────────────────────────
  const qrModal      = document.getElementById('qrModal');
  const qrCodeWrap   = document.getElementById('qrCodeWrap');
  const qrSessionId  = document.getElementById('qrSessionId');
  const qrSessionUrl = document.getElementById('qrSessionUrl');
  let qrInstance     = null;

  function openQrModal(sessionId) {
    const controlUrl = `${window.location.origin}/control/?session=${sessionId}`;

    qrSessionId.textContent = sessionId;
    qrSessionUrl.textContent = controlUrl;

    // Clear and regenerate QR code
    qrCodeWrap.innerHTML = '';
    qrInstance = new QRCode(qrCodeWrap, {
      text: controlUrl,
      width: 188,
      height: 188,
      colorDark: '#000000',
      colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.M,
    });

    qrModal.classList.add('visible');
  }

  function closeQrModal() { qrModal.classList.remove('visible'); }

  document.getElementById('qrModalClose').addEventListener('click', closeQrModal);
  qrModal.addEventListener('click', e => { if (e.target === qrModal) closeQrModal(); });

  poll();
  setInterval(poll, 2000);
</script>
</body>
</html>
