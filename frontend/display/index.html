<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Speaker Timer — Display</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0a;
    --surface: #111111;
    --border: #1e1e1e;
    --text: #f0ede8;
    --muted: #555;
    --accent: #e8ff47;
    --danger: #ff4444;
    --warn: #ff9900;
    --safe: #e8ff47;
    --dim: rgba(255,255,255,0.04);
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    overflow: hidden;
    user-select: none;
  }

  body {
    display: grid;
    grid-template-rows: 1fr auto;
    grid-template-columns: 1fr auto;
    gap: 0;
    height: 100vh;
    padding: 40px;
  }

  /* ── Timer core ── */
  .timer-block {
    grid-column: 1;
    grid-row: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
    gap: 16px;
  }

  .label {
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    font-weight: 400;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .label .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--muted);
    transition: background 0.4s;
  }

  .label .dot.live {
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .time-display {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(120px, 22vw, 280px);
    line-height: 0.88;
    letter-spacing: -0.02em;
    color: var(--text);
    transition: color 0.5s ease;
    tabular-nums: numeric;
    font-variant-numeric: tabular-nums;
  }

  .time-display.warning { color: var(--warn); }
  .time-display.danger  { color: var(--danger); animation: flash 1s step-end infinite; }
  .time-display.overtime { color: var(--danger); }

  @keyframes flash {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .progress-bar {
    width: 100%;
    max-width: 700px;
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
    margin-top: 8px;
  }

  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    transition: width 0.9s linear, background 0.5s ease;
    transform-origin: left;
  }

  .progress-fill.warning { background: var(--warn); }
  .progress-fill.danger  { background: var(--danger); }

  .speaker-name {
    font-family: 'DM Sans', sans-serif;
    font-size: clamp(18px, 2.5vw, 32px);
    font-weight: 300;
    color: var(--muted);
    margin-top: 4px;
    letter-spacing: 0.02em;
    min-height: 1.4em;
    transition: color 0.3s;
  }

  .speaker-name.has-name { color: rgba(240, 237, 232, 0.6); }

  .run-counter {
    font-family: 'DM Mono', monospace;
    font-size: clamp(11px, 1.2vw, 15px);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 2px;
    opacity: 0;
    transition: opacity 0.4s;
  }

  .run-counter.visible { opacity: 1; }

  /* ── Status bar ── */
  .status-bar {
    grid-column: 1;
    grid-row: 2;
    display: flex;
    align-items: center;
    gap: 24px;
    padding-top: 24px;
  }

  .status-pill {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    border: 1px solid var(--border);
    border-radius: 100px;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    transition: all 0.3s;
  }

  .status-pill.running {
    border-color: var(--accent);
    color: var(--accent);
  }

  .status-pill.paused {
    border-color: var(--warn);
    color: var(--warn);
  }

  .overtime-badge {
    display: none;
    padding: 6px 14px;
    background: var(--danger);
    color: #000;
    border-radius: 100px;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    animation: flash 1s step-end infinite;
  }

  .overtime-badge.visible { display: block; }

  /* ── QR panel ── */
  .qr-panel {
    grid-column: 2;
    grid-row: 1 / 3;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding-left: 48px;
    transition: opacity 0.3s, transform 0.3s;
  }

  .qr-panel.hidden {
    opacity: 0;
    pointer-events: none;
    transform: translateX(12px);
  }

  /* ── QR toggle button ── */
  .qr-toggle {
    position: fixed;
    top: 24px;
    right: 24px;
    background: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 12px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
    z-index: 50;
  }

  .qr-toggle:hover { border-color: var(--muted); color: var(--text); }

  .qr-frame {
    width: 160px;
    height: 160px;
    background: #fff;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px;
    flex-shrink: 0;
  }

  .qr-frame canvas,
  .qr-frame img { border-radius: 4px; }

  .qr-label {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    text-align: center;
    line-height: 1.6;
  }

  .session-id {
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    color: var(--accent);
    letter-spacing: 0.15em;
    text-align: center;
    margin-top: 4px;
  }

  /* ── Operator message panel ── */
  .message-panel {
    grid-column: 2;
    grid-row: 1 / 3;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding-left: 48px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s;
  }

  .message-panel.visible { opacity: 1; }

  .message-text {
    font-family: 'DM Sans', sans-serif;
    font-size: clamp(20px, 2.8vw, 40px);
    font-weight: 300;
    color: var(--text);
    text-align: center;
    line-height: 1.4;
    letter-spacing: 0.01em;
    word-break: break-word;
  }

  .message-label {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 16px;
  }

  /* ── Overlay for disconnected state ── */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(10,10,10,0.92);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    z-index: 100;
    transition: opacity 0.4s;
  }

  .overlay.hidden { opacity: 0; pointer-events: none; }

  .overlay-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 48px;
    color: var(--muted);
    letter-spacing: 0.05em;
  }

  .overlay-sub {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }

  /* scan hint shown at bottom during presentation */
  .scan-hint {
    position: fixed;
    bottom: 28px;
    right: 40px;
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    opacity: 0.5;
  }

  /* ── Toolbar (top-right buttons) ── */
  .toolbar {
    position: fixed;
    top: 24px;
    right: 24px;
    display: flex;
    align-items: center;
    gap: 8px;
    z-index: 50;
  }

  .toolbar-btn {
    background: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 12px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .toolbar-btn:hover { border-color: var(--muted); color: var(--text); }
  .toolbar-btn.pip-active { border-color: var(--accent); color: var(--accent); }

  /* ── Message flash overlay ── */
  .message-flash {
    position: fixed;
    inset: 0;
    background: rgba(10,10,10,0.96);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 80;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s;
    padding: 48px;
  }

  .message-flash.visible { opacity: 1; }

  .flash-label {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.25em;
    text-transform: uppercase;
    margin-bottom: 24px;
  }

  .flash-text {
    font-family: 'DM Sans', sans-serif;
    font-size: clamp(28px, 4.5vw, 64px);
    font-weight: 300;
    color: var(--text);
    text-align: center;
    line-height: 1.3;
    max-width: 80%;
    word-break: break-word;
  }

  .flash-countdown {
    position: absolute;
    bottom: 0;
    left: 0;
    height: 3px;
    background: var(--accent);
    width: 100%;
    transform-origin: left;
  }

  .flash-countdown.animating {
    animation: drainBar var(--flash-duration, 5s) linear forwards;
  }

  @keyframes drainBar {
    from { transform: scaleX(1); }
    to   { transform: scaleX(0); }
  }

  /* ── Auto-compact mode (small window) ── */
  @media (max-width: 520px), (max-height: 400px) {
    body {
      grid-template-columns: 1fr;
      grid-template-rows: 1fr auto;
      padding: 20px;
    }

    .timer-block {
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .time-display {
      font-size: clamp(72px, 30vw, 160px);
      text-align: center;
    }

    .progress-bar { max-width: 100%; }

    .speaker-name { text-align: center; }

    .qr-panel,
    .message-panel,
    .scan-hint,
    .toolbar { display: none !important; }

    .status-bar {
      grid-column: 1;
      justify-content: center;
      padding-top: 12px;
    }

    .label { font-size: 11px; }
  }
</style>
</head>
<body>

<div class="timer-block">
  <div class="label">
    <span class="dot" id="liveDot"></span>
    <span id="labelText">Waiting for session</span>
  </div>

  <div class="time-display" id="timeDisplay">--:--</div>

  <div class="progress-bar">
    <div class="progress-fill" id="progressFill" style="width:100%"></div>
  </div>

  <div class="speaker-name" id="speakerName"></div>
  <div class="run-counter" id="runCounter"></div>
</div>

<div class="status-bar">
  <div class="status-pill" id="statusPill">Stopped</div>
  <div class="overtime-badge" id="overtimeBadge">Overtime</div>
</div>

<div class="qr-panel">
  <div class="qr-frame" id="qrFrame">
    <div style="width:140px;height:140px;background:#eee;border-radius:4px;"></div>
  </div>
  <div class="qr-label">Scan to control<br>or view timer</div>
  <div class="session-id" id="sessionIdDisplay">—</div>
</div>

<div class="message-flash" id="messageFlash">
  <div class="flash-label">Message</div>
  <div class="flash-text" id="flashText"></div>
  <div class="flash-countdown" id="flashCountdown"></div>
</div>

<div class="overlay" id="overlay">
  <div class="overlay-title">Connecting…</div>
  <div class="overlay-sub">Reaching server</div>
</div>

<div class="message-panel" id="messagePanel">
  <div class="message-label">Message</div>
  <div class="message-text" id="messageText"></div>
</div>

<div class="toolbar">
  <button class="toolbar-btn" id="pipBtn">Pop Out</button>
  <button class="toolbar-btn" id="qrToggle">Hide QR</button>
</div>
<div class="scan-hint">Scan QR to control</div>

<script>
  // ── Config ──────────────────────────────────────────────────────────────
  // In production this will be your Railway URL
  // For local dev, use ws://localhost:3000
  const SERVER_URL = window.SPEAKER_TIMER_SERVER || 'wss://speaker-timer-production.up.railway.app';

  // Session ID from URL param, or generate one for this display
  const params = new URLSearchParams(window.location.search);
  let sessionId = params.get('session');
  if (!sessionId) {
    sessionId = Math.random().toString(36).slice(2, 8).toUpperCase();
    window.history.replaceState({}, '', `?session=${sessionId}`);
  }

  // ── State ───────────────────────────────────────────────────────────────
  let state = {
    running: false,
    timeRemaining: 0,
    totalTime: 0,
    roomName: '',
    overtime: false,
    runCount: 0,
  };

  // ── DOM refs ─────────────────────────────────────────────────────────────
  const timeDisplay   = document.getElementById('timeDisplay');
  const progressFill  = document.getElementById('progressFill');
  const speakerName   = document.getElementById('speakerName');
  const runCounter    = document.getElementById('runCounter');
  const statusPill    = document.getElementById('statusPill');
  const overtimeBadge = document.getElementById('overtimeBadge');
  const liveDot       = document.getElementById('liveDot');
  const labelText     = document.getElementById('labelText');
  const overlay       = document.getElementById('overlay');
  const sessionIdDisplay = document.getElementById('sessionIdDisplay');

  // ── QR Code ──────────────────────────────────────────────────────────────
  function buildQR() {
    const controlUrl = `${window.location.origin}/control/?session=${sessionId}`;
    document.getElementById('qrFrame').innerHTML = '';
    new QRCode(document.getElementById('qrFrame'), {
      text: controlUrl,
      width: 140,
      height: 140,
      colorDark: '#000000',
      colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.M
    });
    sessionIdDisplay.textContent = sessionId;
  }
  buildQR();

  // ── Format time ───────────────────────────────────────────────────────────
  function formatTime(seconds) {
    if (!Number.isFinite(seconds)) return '--:--';
    const abs = Math.abs(seconds);
    const m = Math.floor(abs / 60);
    const s = abs % 60;
    const sign = seconds < 0 ? '-' : '';
    return `${sign}${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  }

  // ── Render state ──────────────────────────────────────────────────────────
  function render() {
    const { running, timeRemaining, totalTime, roomName, overtime, runCount } = state;
    const pct = totalTime > 0 ? Math.max(0, timeRemaining / totalTime) : 1;
    const isWarning = timeRemaining <= 60 && timeRemaining > 0 && !overtime;
    const isDanger  = timeRemaining <= 30 && timeRemaining > 0 && !overtime;

    timeDisplay.textContent = formatTime(timeRemaining);
    timeDisplay.className = 'time-display' +
      (overtime ? ' overtime' : isDanger ? ' danger' : isWarning ? ' warning' : '');

    progressFill.style.width = (pct * 100) + '%';
    progressFill.className = 'progress-fill' +
      (overtime ? ' danger' : isDanger ? ' danger' : isWarning ? ' warning' : '');

    speakerName.textContent = roomName || '';
    speakerName.className = 'speaker-name' + (roomName ? ' has-name' : '');

    const currentTimer = runCount + 1;
    runCounter.textContent = `Timer ${currentTimer}`;
    runCounter.className = 'run-counter' + ((runCount > 0 || running) ? ' visible' : '');

    statusPill.textContent = running ? 'Running' : 'Paused';
    statusPill.className = 'status-pill' + (running ? ' running' : ' paused');

    overtimeBadge.className = 'overtime-badge' + (overtime ? ' visible' : '');
    liveDot.className = 'dot' + (running ? ' live' : '');
    labelText.textContent = running ? 'Live' : 'Standby';
  }

  // ── WebSocket ──────────────────────────────────────────────────────────────
  let ws, reconnectTimer;

  function connect() {
    try {
      ws = new WebSocket(`${SERVER_URL}?session=${sessionId}&role=display`);
    } catch(e) {
      scheduleReconnect();
      return;
    }

    ws.onopen = () => {
      overlay.classList.add('hidden');
      ws.send(JSON.stringify({ type: 'join', role: 'display', sessionId }));
    };

    ws.onmessage = (e) => {
      try {
        const msg = JSON.parse(e.data);
        if (msg.type === 'state') {
          const prevMessage = state.message;
          state = { ...state, ...msg.payload };
          render();
          updateMessagePanel();
          updatePiP();

          // Flash when a new non-empty message arrives
          if (state.message && state.message !== prevMessage) {
            triggerFlash(state.message);
          } else if (!state.message && prevMessage) {
            dismissFlash();
          }
        }
      } catch {}
    };

    ws.onclose = () => {
      overlay.classList.remove('hidden');
      scheduleReconnect();
    };

    ws.onerror = () => ws.close();
  }

  function scheduleReconnect() {
    clearTimeout(reconnectTimer);
    reconnectTimer = setTimeout(connect, 3000);
  }

  // ── QR toggle + message panel ─────────────────────────────────────────────
  const qrPanel      = document.querySelector('.qr-panel');
  const qrToggle     = document.getElementById('qrToggle');
  const messagePanel = document.getElementById('messagePanel');
  const messageText  = document.getElementById('messageText');
  let qrVisible = true;

  function updateMessagePanel() {
    const msg = state.message || '';
    messageText.textContent = msg;
    messagePanel.classList.toggle('visible', !qrVisible && msg.length > 0);
  }

  qrToggle.addEventListener('click', () => {
    qrVisible = !qrVisible;
    qrPanel.classList.toggle('hidden', !qrVisible);
    qrToggle.textContent = qrVisible ? 'Hide QR' : 'Show QR';
    updateMessagePanel();
  });

  // ── Message flash ────────────────────────────────────────────────────────
  const messageFlash    = document.getElementById('messageFlash');
  const flashText       = document.getElementById('flashText');
  const flashCountdown  = document.getElementById('flashCountdown');
  const FLASH_DURATION  = 5000; // ms
  let flashTimer        = null;
  let lastMessage       = '';

  function triggerFlash(msg) {
    flashText.textContent = msg;
    messageFlash.classList.add('visible');

    // Restart countdown bar animation
    flashCountdown.classList.remove('animating');
    flashCountdown.style.setProperty('--flash-duration', (FLASH_DURATION / 1000) + 's');
    // Force reflow so animation restarts cleanly
    void flashCountdown.offsetWidth;
    flashCountdown.classList.add('animating');

    clearTimeout(flashTimer);
    flashTimer = setTimeout(() => {
      messageFlash.classList.remove('visible');
    }, FLASH_DURATION);

    // Flash in PiP too
    pipFlash(msg);
  }

  function dismissFlash() {
    clearTimeout(flashTimer);
    messageFlash.classList.remove('visible');
    flashCountdown.classList.remove('animating');
    pipRestoreTimer();
  }

  // ── Picture-in-Picture ────────────────────────────────────────────────────
  const pipBtn = document.getElementById('pipBtn');
  let pipWindow = null;

  function updatePiP() {
    if (!pipWindow) return;
    const { running, timeRemaining, overtime, speakerName: name } = state;
    const isWarning = timeRemaining <= 60 && timeRemaining > 0 && !overtime;
    const isDanger  = timeRemaining <= 30 && timeRemaining > 0 && !overtime;
    const tc = overtime ? 'overtime' : isDanger ? 'danger' : isWarning ? 'warning' : '';

    const t = pipWindow.document.getElementById('pt');
    const s = pipWindow.document.getElementById('ps');
    const d = pipWindow.document.getElementById('pd');
    if (t) { t.textContent = formatTime(timeRemaining); t.className = 'time ' + tc; }
    if (s) { s.textContent = name || ''; }
    if (d) { d.textContent = running ? 'Live' : (overtime ? 'Overtime' : 'Paused'); d.className = 'dot ' + (running ? 'live' : ''); }
  }

  let pipFlashTimer = null;

  function pipFlash(msg) {
    if (!pipWindow) return;
    const timerEl = pipWindow.document.getElementById('pip-timer');
    const msgEl   = pipWindow.document.getElementById('pip-msg');
    const msgText = pipWindow.document.getElementById('pm');
    const msgBar  = pipWindow.document.getElementById('pb');
    if (!timerEl || !msgEl) return;

    msgText.textContent = msg;
    timerEl.style.display = 'none';
    msgEl.style.display = 'flex';

    // Restart bar animation
    msgBar.classList.remove('drain');
    msgBar.style.setProperty('--d', (FLASH_DURATION / 1000) + 's');
    void msgBar.offsetWidth;
    msgBar.classList.add('drain');

    clearTimeout(pipFlashTimer);
    pipFlashTimer = setTimeout(pipRestoreTimer, FLASH_DURATION);
  }

  function pipRestoreTimer() {
    if (!pipWindow) return;
    clearTimeout(pipFlashTimer);
    const timerEl = pipWindow.document.getElementById('pip-timer');
    const msgEl   = pipWindow.document.getElementById('pip-msg');
    if (timerEl) timerEl.style.display = 'flex';
    if (msgEl)   msgEl.style.display   = 'none';
    updatePiP();
  }

  async function openPiP() {
    if (!window.documentPictureInPicture) {
      alert('Picture-in-Picture requires Chrome 116 or later.');
      return;
    }
    try {
      pipWindow = await window.documentPictureInPicture.requestWindow({ width: 340, height: 180 });

      // Fonts
      const link = pipWindow.document.createElement('link');
      link.rel = 'stylesheet';
      link.href = 'https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400&display=swap';
      pipWindow.document.head.appendChild(link);

      // Styles
      const style = pipWindow.document.createElement('style');
      style.textContent = `
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
          background: #0a0a0a; color: #f0ede8;
          display: flex; flex-direction: column;
          align-items: center; justify-content: center;
          height: 100vh; gap: 6px; padding: 16px;
          font-family: sans-serif; overflow: hidden;
          user-select: none;
        }
        .time {
          font-family: 'Bebas Neue', sans-serif;
          font-size: clamp(60px, 22vw, 120px);
          line-height: 1; letter-spacing: -0.01em;
          font-variant-numeric: tabular-nums;
          transition: color 0.4s;
        }
        .time.warning { color: #ff9900; }
        .time.danger  { color: #ff4444; animation: flash 1s step-end infinite; }
        .time.overtime { color: #ff4444; }
        @keyframes flash { 0%,100%{opacity:1} 50%{opacity:0.3} }
        .speaker {
          font-family: 'DM Mono', monospace;
          font-size: clamp(9px, 2.5vw, 13px);
          color: rgba(240,237,232,0.5);
          letter-spacing: 0.12em; text-transform: uppercase;
          text-align: center; max-width: 100%;
          overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .dot {
          width: 6px; height: 6px; border-radius: 50%;
          background: #333; transition: background 0.3s;
        }
        .dot.live { background: #e8ff47; box-shadow: 0 0 6px #e8ff47;
          animation: pulse 2s ease-in-out infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
        #pip-timer { display:flex; flex-direction:column; align-items:center; gap:6px; }
        #pip-msg {
          flex-direction:column; align-items:center; justify-content:center;
          gap:12px; text-align:center; padding:12px; width:100%;
        }
        .msg-text {
          font-family:'DM Sans',sans-serif;
          font-size:clamp(16px,5vw,28px);
          font-weight:300; color:#f0ede8;
          line-height:1.3; word-break:break-word;
        }
        .msg-bar {
          width:100%; height:3px; background:#e8ff47;
          transform-origin:left; border-radius:2px;
        }
        .msg-bar.drain {
          animation: drain var(--d,5s) linear forwards;
        }
        @keyframes drain { from{transform:scaleX(1)} to{transform:scaleX(0)} }
      `;
      pipWindow.document.head.appendChild(style);

      pipWindow.document.body.innerHTML = `
        <div id="pip-timer">
          <div class="dot" id="pd"></div>
          <div class="time" id="pt">--:--</div>
          <div class="speaker" id="ps"></div>
        </div>
        <div id="pip-msg" style="display:none">
          <div class="msg-text" id="pm"></div>
          <div class="msg-bar" id="pb"></div>
        </div>
      `;

      pipBtn.textContent = 'Close Pop Out';
      pipBtn.classList.add('pip-active');
      updatePiP();

      pipWindow.addEventListener('pagehide', () => {
        pipWindow = null;
        pipBtn.textContent = 'Pop Out';
        pipBtn.classList.remove('pip-active');
      });

    } catch(e) {
      pipWindow = null;
      console.error('PiP failed:', e);
    }
  }

  function closePiP() {
    pipWindow?.close();
    pipWindow = null;
    pipBtn.textContent = 'Pop Out';
    pipBtn.classList.remove('pip-active');
  }

  pipBtn.addEventListener('click', () => {
    pipWindow ? closePiP() : openPiP();
  });

  connect();

  // ── Local tick ────────────────────────────────────────────────────────────
  setInterval(() => { render(); updatePiP(); }, 500);
</script>
</body>
</html>
