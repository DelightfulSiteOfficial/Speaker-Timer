<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Speaker Timer — Display</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0a;
    --surface: #111111;
    --border: #1e1e1e;
    --text: #f0ede8;
    --muted: #555;
    --accent: #e8ff47;
    --danger: #ff4444;
    --warn: #ff9900;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    overflow: hidden;
    user-select: none;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    padding: 48px 60px;
  }

  /* ── Timer block — always centered ── */
  .timer-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    width: 100%;
  }

  /* ── Live/Standby label ── */
  .label {
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 10px;
    transition: opacity 0.4s;
  }

  .label .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--muted);
    transition: background 0.4s;
    flex-shrink: 0;
  }

  .label .dot.live {
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
    animation: dotPulse 2s ease-in-out infinite;
  }

  @keyframes dotPulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  /* ── Timer numeral ── */
  .time-display {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(140px, 26vw, 340px);
    line-height: 0.88;
    letter-spacing: -0.02em;
    color: var(--text);
    transition: color 0.5s ease;
    font-variant-numeric: tabular-nums;
  }

  .time-display.warning { color: var(--warn); }
  .time-display.danger  { color: var(--danger); }
  .time-display.overtime { color: var(--danger); }

  /* ── Progress bar ── */
  .progress-bar {
    width: min(100%, 820px);
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
    margin-top: 4px;
  }

  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    transition: width 0.9s linear, background 0.5s ease;
  }

  .progress-fill.warning { background: var(--warn); }
  .progress-fill.danger  { background: var(--danger); }

  /* ── Speaker name ── */
  .speaker-name {
    font-family: 'DM Sans', sans-serif;
    font-size: clamp(18px, 2.2vw, 30px);
    font-weight: 300;
    color: rgba(240, 237, 232, 0.45);
    letter-spacing: 0.03em;
    min-height: 1.4em;
    text-align: center;
    transition: color 0.3s;
  }

  .speaker-name.has-name { color: rgba(240, 237, 232, 0.6); }

  /* ── Status row (pill + overtime + run counter) ── */
  .status-row {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-top: 4px;
    transition: opacity 0.4s;
  }

  .status-pill {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 14px;
    border: 1px solid var(--border);
    border-radius: 100px;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    transition: all 0.3s;
  }

  .status-pill.running { border-color: var(--accent); color: var(--accent); }
  .status-pill.paused  { border-color: var(--warn);   color: var(--warn);   }

  .overtime-badge {
    display: none;
    padding: 5px 14px;
    background: var(--danger);
    color: #000;
    border-radius: 100px;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    animation: flash 1s step-end infinite;
  }

  @keyframes flash { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

  .overtime-badge.visible { display: block; }

  .run-counter {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    opacity: 0;
    transition: opacity 0.4s;
  }

  .run-counter.visible { opacity: 1; }

  /* ── Info hidden state ── */
  body.hide-info .label,
  body.hide-info .status-row {
    opacity: 0;
    pointer-events: none;
  }

  /* ── QR panel — fixed bottom-right corner ── */
  .qr-panel {
    position: fixed;
    bottom: 36px;
    right: 40px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px 20px 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    transition: opacity 0.35s, transform 0.35s;
    z-index: 10;
  }

  .qr-panel.hidden {
    opacity: 0;
    pointer-events: none;
    transform: translateY(10px);
  }

  .qr-frame {
    width: 148px;
    height: 148px;
    background: #fff;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px;
    flex-shrink: 0;
  }

  .qr-frame canvas,
  .qr-frame img { border-radius: 3px; }

  .qr-label {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    text-align: center;
    line-height: 1.7;
  }

  .session-id {
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    color: var(--accent);
    letter-spacing: 0.2em;
    text-align: center;
  }

  /* ── Top bar — holds mode tabs (left) and utility buttons (right) ── */
  .top-bar {
    position: fixed;
    top: 0; left: 0; right: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 24px;
    z-index: 50;
    pointer-events: none;
  }

  /* ── Mode tabs ── */
  .mode-tabs {
    display: flex;
    background: rgba(14,14,14,0.9);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    gap: 2px;
    pointer-events: auto;
    backdrop-filter: blur(12px);
  }

  .mode-tab {
    background: none;
    border: none;
    border-radius: 8px;
    padding: 9px 22px;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .mode-tab:hover { color: var(--text); }
  .mode-tab.tab-active-presenter { background: #22c55e; color: #000; font-weight: 500; }
  .mode-tab.tab-active-admin     { background: var(--surface); color: var(--text); border: 1px solid #333; }
  .mode-tab.tab-locked           { opacity: 0.35; cursor: not-allowed; pointer-events: none; }

  /* ── Utility buttons (top-right) ── */
  .toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    pointer-events: auto;
  }

  .toolbar-btn {
    background: rgba(14,14,14,0.9);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 12px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
    backdrop-filter: blur(12px);
  }

  .toolbar-btn:hover { border-color: var(--muted); color: var(--text); }
  .toolbar-btn.active { border-color: var(--accent); color: var(--accent); }

  /* ── Disconnected overlay ── */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(10,10,10,0.92);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    z-index: 100;
    transition: opacity 0.4s;
  }

  .overlay.hidden { opacity: 0; pointer-events: none; }

  .overlay-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 48px;
    color: var(--muted);
    letter-spacing: 0.05em;
  }

  .overlay-sub {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }

  /* ── Message flash overlay ── */
  .message-flash {
    position: fixed;
    inset: 0;
    background: rgba(10,10,10,0.96);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 80;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s;
    padding: 48px;
  }

  .message-flash.visible { opacity: 1; }

  .flash-label {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.25em;
    text-transform: uppercase;
    margin-bottom: 24px;
  }

  .flash-text {
    font-family: 'DM Sans', sans-serif;
    font-size: clamp(48px, 9vw, 160px);
    font-weight: 300;
    color: var(--text);
    text-align: center;
    line-height: 1.2;
    max-width: 90%;
    word-break: break-word;
  }

  .flash-countdown {
    position: absolute;
    bottom: 0;
    left: 0;
    height: 3px;
    background: var(--accent);
    width: 100%;
    transform-origin: left;
  }

  .flash-countdown.animating {
    animation: drainBar var(--flash-duration, 5s) linear forwards;
  }

  @keyframes drainBar {
    from { transform: scaleX(1); }
    to   { transform: scaleX(0); }
  }

  /* ── Background warning pulses ── */
  @keyframes bgPulseWarn {
    0%, 100% { background-color: #0a0a0a; }
    50%       { background-color: #221d08; }
  }
  @keyframes bgPulseDangerSlow {
    0%, 100% { background-color: #0a0a0a; }
    50%       { background-color: #280606; }
  }
  @keyframes bgPulseDangerFast {
    0%, 100% { background-color: #0a0a0a; }
    50%       { background-color: #360808; }
  }

  body.pulse-warn         { animation: bgPulseWarn        5.5s ease-in-out infinite; }
  body.pulse-danger-slow  { animation: bgPulseDangerSlow  2.8s ease-in-out infinite; }
  body.pulse-danger-fast  { animation: bgPulseDangerFast  1.6s ease-in-out infinite; }
  body.bg-overtime        { background-color: #200404 !important; animation: none; }

  /* ── Presenter controls panel ── */
  .presenter-panel {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: rgba(10,10,10,0.95);
    border-top: 1px solid #1e1e1e;
    padding: 20px 40px 28px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    z-index: 60;
    opacity: 0;
    pointer-events: none;
    transform: translateY(12px);
    transition: opacity 0.3s, transform 0.3s;
  }

  .presenter-panel.visible {
    opacity: 1;
    pointer-events: auto;
    transform: translateY(0);
  }

  .presenter-row {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .presenter-label {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    flex-shrink: 0;
    width: 60px;
  }

  .presenter-presets {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .presenter-preset {
    background: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 14px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    cursor: pointer;
    transition: all 0.15s;
  }

  .presenter-preset:hover { border-color: var(--muted); color: var(--text); }
  .presenter-preset.selected { border-color: var(--accent); color: var(--accent); }

  .presenter-actions {
    display: flex;
    gap: 10px;
    margin-left: auto;
  }

  .presenter-btn {
    height: 42px;
    padding: 0 28px;
    border-radius: 10px;
    border: none;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 0.05em;
    cursor: pointer;
    transition: all 0.15s;
  }

  .presenter-btn.start  { background: #22c55e; color: #000; }
  .presenter-btn.pause  { background: var(--danger); color: #fff; }
  .presenter-btn.reset  { background: none; border: 1px solid var(--border); color: var(--muted); font-size: 14px; font-family: 'DM Mono', monospace; letter-spacing: 0.1em; }
  .presenter-btn:hover  { opacity: 0.85; }
  .presenter-btn:active { transform: scale(0.96); }

  /* ── Compact / small window ── */
  @media (max-width: 520px), (max-height: 400px) {
    body { padding: 20px; }
    .time-display { font-size: clamp(72px, 30vw, 160px); }
    .qr-panel, .top-bar { display: none !important; }
    .label { font-size: 11px; }
  }
</style>
</head>
<body>

<!-- Timer -->
<div class="timer-block">
  <div class="label">
    <span class="dot" id="liveDot"></span>
    <span id="labelText">Waiting for session</span>
  </div>

  <div class="time-display" id="timeDisplay">--:--</div>

  <div class="progress-bar">
    <div class="progress-fill" id="progressFill" style="width:100%"></div>
  </div>

  <div class="speaker-name" id="speakerName"></div>

  <div class="status-row">
    <div class="status-pill" id="statusPill">Stopped</div>
    <div class="overtime-badge" id="overtimeBadge">Overtime</div>
    <div class="run-counter" id="runCounter"></div>
  </div>
</div>

<!-- QR panel — bottom-right corner -->
<div class="qr-panel" id="qrPanel">
  <div class="qr-frame" id="qrFrame">
    <div style="width:132px;height:132px;background:#eee;border-radius:3px;"></div>
  </div>
  <div class="qr-label">Scan to control</div>
  <div class="session-id" id="sessionIdDisplay">—</div>
</div>

<!-- Top bar: mode tabs + utility buttons -->
<div class="top-bar">
  <div class="mode-tabs">
    <button class="mode-tab" id="tabPresenter">Presenter Mode</button>
    <button class="mode-tab tab-active-admin" id="tabAdmin">Admin Mode</button>
  </div>
  <div class="toolbar">
    <button class="toolbar-btn" id="pipBtn">Pop Out</button>
    <button class="toolbar-btn" id="infoToggle">Hide Info</button>
    <button class="toolbar-btn" id="qrToggle">Hide QR</button>
  </div>
</div>

<!-- Presenter controls panel -->
<div class="presenter-panel" id="presenterPanel">
  <div class="presenter-row">
    <span class="presenter-label">Duration</span>
    <div class="presenter-presets">
      <button class="presenter-preset" data-mins="5">5 min</button>
      <button class="presenter-preset" data-mins="10">10 min</button>
      <button class="presenter-preset" data-mins="15">15 min</button>
      <button class="presenter-preset" data-mins="20">20 min</button>
      <button class="presenter-preset" data-mins="30">30 min</button>
      <button class="presenter-preset" data-mins="45">45 min</button>
      <button class="presenter-preset" data-mins="60">60 min</button>
    </div>
  </div>
  <div class="presenter-row">
    <div class="presenter-actions">
      <button class="presenter-btn reset" id="presenterReset">Reset</button>
      <button class="presenter-btn start" id="presenterStart">Start</button>
    </div>
  </div>
</div>

<!-- Message flash -->
<div class="message-flash" id="messageFlash">
  <div class="flash-label">Message</div>
  <div class="flash-text" id="flashText"></div>
  <div class="flash-countdown" id="flashCountdown"></div>
</div>

<!-- Disconnected overlay -->
<div class="overlay" id="overlay">
  <div class="overlay-title">Connecting…</div>
  <div class="overlay-sub">Reaching server</div>
</div>

<script>
  const SERVER_URL = window.SPEAKER_TIMER_SERVER || 'wss://speaker-timer-production.up.railway.app';

  const params = new URLSearchParams(window.location.search);
  let sessionId = params.get('session');
  if (!sessionId) {
    sessionId = Math.random().toString(36).slice(2, 8).toUpperCase();
    window.history.replaceState({}, '', `?session=${sessionId}`);
  }

  // ── State ──────────────────────────────────────────────────────────────────
  let state = {
    running: false, timeRemaining: 0, totalTime: 0,
    roomName: '', overtime: false, runCount: 0,
    message: '', messageSeq: 0, presenterLocked: false,
  };

  // ── Client-side fallback tick ───────────────────────────────────────────────
  // Records when the last authoritative state arrived from the server.
  // getDisplayTime() interpolates locally so the display never freezes during
  // a WiFi hiccup — it resyncs automatically the moment the server reconnects.
  let lastStateTime = Date.now();

  function getDisplayTime() {
    if (!state.running) return state.timeRemaining;
    const elapsed = Math.floor((Date.now() - lastStateTime) / 1000);
    // Cap so a very long disconnect (tab backgrounded, etc.) doesn't go wild
    return Math.max(-1800, state.timeRemaining - elapsed);
  }

  // ── DOM ────────────────────────────────────────────────────────────────────
  const timeDisplay      = document.getElementById('timeDisplay');
  const progressFill     = document.getElementById('progressFill');
  const speakerName      = document.getElementById('speakerName');
  const runCounter       = document.getElementById('runCounter');
  const statusPill       = document.getElementById('statusPill');
  const overtimeBadge    = document.getElementById('overtimeBadge');
  const liveDot          = document.getElementById('liveDot');
  const labelText        = document.getElementById('labelText');
  const overlay          = document.getElementById('overlay');
  const sessionIdDisplay = document.getElementById('sessionIdDisplay');

  // ── QR Code ────────────────────────────────────────────────────────────────
  function buildQR() {
    const controlUrl = `${window.location.origin}/control/?session=${sessionId}`;
    document.getElementById('qrFrame').innerHTML = '';
    new QRCode(document.getElementById('qrFrame'), {
      text: controlUrl,
      width: 132, height: 132,
      colorDark: '#000000', colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.M
    });
    sessionIdDisplay.textContent = sessionId;
  }
  buildQR();

  // ── Format time ────────────────────────────────────────────────────────────
  function formatTime(seconds) {
    if (!Number.isFinite(seconds)) return '--:--';
    const abs = Math.abs(seconds);
    const m = Math.floor(abs / 60);
    const s = abs % 60;
    const sign = seconds < 0 ? '-' : '';
    return `${sign}${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  }

  // ── Render ─────────────────────────────────────────────────────────────────
  function render() {
    const { running, totalTime, roomName, runCount } = state;
    const timeRemaining = getDisplayTime();   // locally interpolated
    const overtime      = timeRemaining < 0;  // derived locally too
    const pct        = totalTime > 0 ? Math.max(0, timeRemaining / totalTime) : 1;
    const isWarning  = timeRemaining <= 60 && timeRemaining > 0 && !overtime;
    const isDanger   = timeRemaining <= 30 && timeRemaining > 0 && !overtime;

    timeDisplay.textContent = formatTime(timeRemaining);
    timeDisplay.className = 'time-display' +
      (overtime ? ' overtime' : isDanger ? ' danger' : isWarning ? ' warning' : '');

    progressFill.style.width = (pct * 100) + '%';
    progressFill.className = 'progress-fill' +
      (overtime ? ' danger' : isDanger ? ' danger' : isWarning ? ' warning' : '');

    speakerName.textContent = roomName || '';
    speakerName.className = 'speaker-name' + (roomName ? ' has-name' : '');

    runCounter.textContent = `Timer ${runCount + 1}`;
    runCounter.className = 'run-counter' + ((runCount > 0 || running) ? ' visible' : '');

    statusPill.textContent = running ? 'Running' : 'Paused';
    statusPill.className = 'status-pill' + (running ? ' running' : ' paused');

    overtimeBadge.className = 'overtime-badge' + (overtime ? ' visible' : '');
    liveDot.className = 'dot' + (running ? ' live' : '');
    labelText.textContent = running ? 'Live' : 'Standby';

    // Keep presenter panel start button in sync
    if (presenterStart) {
      presenterStart.textContent = running ? 'Pause' : 'Start';
      presenterStart.className = 'presenter-btn ' + (running ? 'pause' : 'start');
    }

    // Enforce presenter lock — boot off presenter mode if admin has locked it
    const locked = !!state.presenterLocked;
    tabPresenter.classList.toggle('tab-locked', locked);
    tabPresenter.textContent = locked ? 'Presenter Mode 🔒' : 'Presenter Mode';
    if (locked && presenterMode) setMode('admin');

    // Background pulse states
    const isWarn5  = timeRemaining <= 300 && timeRemaining > 60 && !overtime;
    const isWarn1  = timeRemaining <= 60  && timeRemaining > 30 && !overtime;
    const isWarn30 = timeRemaining <= 30  && timeRemaining > 0  && !overtime;
    document.body.classList.toggle('pulse-warn',        isWarn5);
    document.body.classList.toggle('pulse-danger-slow', isWarn1);
    document.body.classList.toggle('pulse-danger-fast', isWarn30);
    document.body.classList.toggle('bg-overtime',       !!overtime);
  }

  // ── WebSocket ──────────────────────────────────────────────────────────────
  let ws, reconnectTimer;
  let everConnected = false;

  const overlayTitle = document.querySelector('.overlay-title');
  const overlaySub   = document.querySelector('.overlay-sub');

  function connect() {
    try {
      ws = new WebSocket(`${SERVER_URL}?session=${sessionId}&role=display`);
    } catch(e) { scheduleReconnect(); return; }

    ws.onopen = () => {
      overlay.classList.add('hidden');
      lastStateTime = Date.now(); // reset interpolation clock on (re)connect
      everConnected = true;
      ws.send(JSON.stringify({ type: 'join', role: 'display', sessionId }));
    };

    ws.onmessage = (e) => {
      try {
        const msg = JSON.parse(e.data);
        if (msg.type === 'state') {
          const prevMessage    = state.message;
          const prevMessageSeq = state.messageSeq;
          lastStateTime = Date.now(); // authoritative update — reset clock
          state = { ...state, ...msg.payload };
          render();
          updatePiP();
          if (state.message && state.messageSeq !== prevMessageSeq) {
            triggerFlash(state.message);
          } else if (!state.message && prevMessage) {
            dismissFlash();
          }
        }
      } catch {}
    };

    ws.onclose = () => {
      overlay.classList.remove('hidden');
      if (everConnected) {
        overlayTitle.textContent = 'Reconnecting…';
        overlaySub.textContent   = state.running ? 'Timer continuing locally' : 'Connection lost';
      }
      scheduleReconnect();
    };
    ws.onerror = () => ws.close();
  }

  function scheduleReconnect() {
    clearTimeout(reconnectTimer);
    reconnectTimer = setTimeout(connect, 3000);
  }

  // ── Toolbar toggles ────────────────────────────────────────────────────────
  const qrPanel    = document.getElementById('qrPanel');
  const qrToggle   = document.getElementById('qrToggle');
  const infoToggle = document.getElementById('infoToggle');

  let qrVisible   = true;
  let infoVisible = true;

  qrToggle.addEventListener('click', () => {
    qrVisible = !qrVisible;
    qrPanel.classList.toggle('hidden', !qrVisible);
    qrToggle.textContent = qrVisible ? 'Hide QR' : 'Show QR';
    qrToggle.classList.toggle('active', !qrVisible);
  });

  infoToggle.addEventListener('click', () => {
    infoVisible = !infoVisible;
    document.body.classList.toggle('hide-info', !infoVisible);
    infoToggle.textContent = infoVisible ? 'Hide Info' : 'Show Info';
    infoToggle.classList.toggle('active', !infoVisible);
  });

  // ── Mode switching (Presenter / Admin) ───────────────────────────────────
  const tabPresenter  = document.getElementById('tabPresenter');
  const tabAdmin      = document.getElementById('tabAdmin');
  const presenterPanel = document.getElementById('presenterPanel');
  const presenterStart = document.getElementById('presenterStart');
  const presenterReset = document.getElementById('presenterReset');

  let presenterMode = false;
  let ctrlWs        = null;

  function sendCtrl(msg) {
    if (ctrlWs?.readyState === WebSocket.OPEN) {
      ctrlWs.send(JSON.stringify({ ...msg, sessionId }));
    }
  }

  function openCtrlWs() {
    if (ctrlWs?.readyState === WebSocket.OPEN) return;
    ctrlWs = new WebSocket(`${SERVER_URL}?session=${sessionId}&role=control`);
    ctrlWs.onopen  = () => ctrlWs.send(JSON.stringify({ type: 'join', role: 'control', sessionId }));
    ctrlWs.onclose = () => { ctrlWs = null; };
    ctrlWs.onerror = () => ctrlWs?.close();
  }

  function closeCtrlWs() {
    if (ctrlWs) { ctrlWs.onclose = null; ctrlWs.close(); ctrlWs = null; }
  }

  function setMode(mode) {
    presenterMode = (mode === 'presenter');

    // Tab styles
    tabPresenter.className = 'mode-tab' + (presenterMode ? ' tab-active-presenter' : '');
    tabAdmin.className     = 'mode-tab' + (!presenterMode ? ' tab-active-admin' : '');

    // Show/hide presenter panel
    presenterPanel.classList.toggle('visible', presenterMode);

    // Show/hide QR (admin shows it, presenter hides it)
    qrVisible = !presenterMode;
    qrPanel.classList.toggle('hidden', !qrVisible);
    qrToggle.textContent = qrVisible ? 'Hide QR' : 'Show QR';
    qrToggle.classList.toggle('active', !qrVisible);

    // Control WS
    if (presenterMode) openCtrlWs(); else closeCtrlWs();
  }

  tabPresenter.addEventListener('click', () => setMode('presenter'));
  tabAdmin.addEventListener('click',     () => setMode('admin'));

  // Duration presets
  document.querySelectorAll('.presenter-preset').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.presenter-preset').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      sendCtrl({ type: 'set_duration', seconds: parseInt(btn.dataset.mins) * 60 });
    });
  });

  // Start / Pause toggle
  presenterStart.addEventListener('click', () => {
    if (state.running) {
      sendCtrl({ type: 'pause' });
    } else {
      sendCtrl({ type: 'start' });
    }
  });

  // Reset
  presenterReset.addEventListener('click', () => sendCtrl({ type: 'reset' }));

  // Keep Start button label in sync with running state
  const _origRender = render;
  // (patched below after render is defined — see bottom of script)

  // ── Message flash ──────────────────────────────────────────────────────────
  const messageFlash   = document.getElementById('messageFlash');
  const flashText      = document.getElementById('flashText');
  const flashCountdown = document.getElementById('flashCountdown');
  const FLASH_DURATION = 5000;
  let flashTimer       = null;

  function triggerFlash(msg) {
    flashText.textContent = msg;
    messageFlash.classList.add('visible');
    flashCountdown.classList.remove('animating');
    flashCountdown.style.setProperty('--flash-duration', (FLASH_DURATION / 1000) + 's');
    void flashCountdown.offsetWidth;
    flashCountdown.classList.add('animating');
    clearTimeout(flashTimer);
    flashTimer = setTimeout(() => messageFlash.classList.remove('visible'), FLASH_DURATION);
    pipFlash(msg);
  }

  function dismissFlash() {
    clearTimeout(flashTimer);
    messageFlash.classList.remove('visible');
    flashCountdown.classList.remove('animating');
    pipRestoreTimer();
  }

  // ── Picture-in-Picture ─────────────────────────────────────────────────────
  const pipBtn = document.getElementById('pipBtn');
  let pipWindow = null;

  function updatePiP() {
    if (!pipWindow) return;
    const { speakerName: name, running } = state;
    const timeRemaining = getDisplayTime();   // locally interpolated
    const overtime      = timeRemaining < 0;
    const isWarning = timeRemaining <= 60 && timeRemaining > 0 && !overtime;
    const isDanger  = timeRemaining <= 30 && timeRemaining > 0 && !overtime;
    const tc = overtime ? 'overtime' : isDanger ? 'danger' : isWarning ? 'warning' : '';

    const t = pipWindow.document.getElementById('pt');
    const s = pipWindow.document.getElementById('ps');
    const h = pipWindow.document.getElementById('pip-hint');
    if (t) { t.textContent = formatTime(timeRemaining); t.className = 'time ' + tc; }
    if (s) { s.textContent = name || ''; }
    if (h) { h.textContent = running ? 'tap · pause   dbl · reset' : 'tap · start   dbl · reset'; }

    const pb = pipWindow.document.body;
    const isWarn5  = timeRemaining <= 300 && timeRemaining > 60 && !overtime;
    const isWarn1  = timeRemaining <= 60  && timeRemaining > 30 && !overtime;
    const isWarn30 = timeRemaining <= 30  && timeRemaining > 0  && !overtime;
    pb.classList.toggle('pulse-warn',        isWarn5);
    pb.classList.toggle('pulse-danger-slow', isWarn1);
    pb.classList.toggle('pulse-danger-fast', isWarn30);
    pb.classList.toggle('bg-overtime',       !!overtime);
  }

  let pipFlashTimer = null;

  function pipFlash(msg) {
    if (!pipWindow) return;
    const timerEl = pipWindow.document.getElementById('pip-timer');
    const msgEl   = pipWindow.document.getElementById('pip-msg');
    const msgText = pipWindow.document.getElementById('pm');
    const msgBar  = pipWindow.document.getElementById('pb');
    if (!timerEl || !msgEl) return;
    msgText.textContent = msg;
    timerEl.style.display = 'none';
    msgEl.style.display = 'flex';
    msgBar.classList.remove('drain');
    msgBar.style.setProperty('--d', (FLASH_DURATION / 1000) + 's');
    void msgBar.offsetWidth;
    msgBar.classList.add('drain');
    clearTimeout(pipFlashTimer);
    pipFlashTimer = setTimeout(pipRestoreTimer, FLASH_DURATION);
  }

  function pipRestoreTimer() {
    if (!pipWindow) return;
    clearTimeout(pipFlashTimer);
    const timerEl = pipWindow.document.getElementById('pip-timer');
    const msgEl   = pipWindow.document.getElementById('pip-msg');
    if (timerEl) timerEl.style.display = 'flex';
    if (msgEl)   msgEl.style.display   = 'none';
    updatePiP();
  }

  async function openPiP() {
    if (!window.documentPictureInPicture) {
      alert('Picture-in-Picture requires Chrome 116 or later.');
      return;
    }
    try {
      pipWindow = await window.documentPictureInPicture.requestWindow({ width: 340, height: 180 });

      const link = pipWindow.document.createElement('link');
      link.rel = 'stylesheet';
      link.href = 'https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400&display=swap';
      pipWindow.document.head.appendChild(link);

      const style = pipWindow.document.createElement('style');
      style.textContent = `
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
          background: #0a0a0a; color: #f0ede8;
          display: flex; flex-direction: column;
          align-items: center; justify-content: center;
          height: 100vh; gap: 6px; padding: 16px;
          font-family: sans-serif; overflow: hidden; user-select: none;
        }
        .time {
          font-family: 'Bebas Neue', sans-serif;
          font-size: clamp(60px, 22vw, 120px);
          line-height: 1; letter-spacing: -0.01em;
          font-variant-numeric: tabular-nums; transition: color 0.4s;
        }
        .time.warning { color: #ff9900; }
        .time.danger, .time.overtime { color: #ff4444; }
        @keyframes bgPulseWarn       { 0%,100%{background-color:#0a0a0a} 50%{background-color:#221d08} }
        @keyframes bgPulseDangerSlow { 0%,100%{background-color:#0a0a0a} 50%{background-color:#280606} }
        @keyframes bgPulseDangerFast { 0%,100%{background-color:#0a0a0a} 50%{background-color:#360808} }
        body.pulse-warn        { animation: bgPulseWarn       5.5s ease-in-out infinite; }
        body.pulse-danger-slow { animation: bgPulseDangerSlow 2.8s ease-in-out infinite; }
        body.pulse-danger-fast { animation: bgPulseDangerFast 1.6s ease-in-out infinite; }
        body.bg-overtime       { background-color: #200404 !important; animation: none; }
        .speaker {
          font-family: 'DM Mono', monospace;
          font-size: clamp(9px, 2.5vw, 13px);
          color: rgba(240,237,232,0.5);
          letter-spacing: 0.12em; text-transform: uppercase;
          text-align: center; max-width: 100%;
          overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        #pip-timer { display:flex; flex-direction:column; align-items:center; gap:6px; }
        #pip-msg {
          flex-direction:column; align-items:center; justify-content:center;
          gap:12px; text-align:center; padding:12px; width:100%;
        }
        .msg-text {
          font-family:'DM Sans',sans-serif;
          font-size:clamp(16px,5vw,28px);
          font-weight:300; color:#f0ede8;
          line-height:1.3; word-break:break-word;
        }
        .msg-bar { width:100%; height:3px; background:#e8ff47; transform-origin:left; border-radius:2px; }
        .msg-bar.drain { animation: drain var(--d,5s) linear forwards; }
        @keyframes drain { from{transform:scaleX(1)} to{transform:scaleX(0)} }
        #pip-input {
          display:none; flex-direction:column; align-items:center;
          justify-content:center; gap:8px; width:100%; padding:12px;
        }
        #pip-input.visible { display:flex; }
        .pip-min-input {
          background:#1a1a1a; border:2px solid #e8ff47; border-radius:10px;
          color:#f0ede8; font-family:'Bebas Neue',sans-serif;
          font-size:clamp(40px,14vw,72px); text-align:center;
          width:100%; outline:none; padding:4px 0; line-height:1;
          -moz-appearance:textfield;
        }
        .pip-min-input::-webkit-inner-spin-button,
        .pip-min-input::-webkit-outer-spin-button { -webkit-appearance:none; }
        .pip-min-label {
          font-family:'DM Mono',monospace; font-size:10px;
          letter-spacing:.2em; text-transform:uppercase; color:#555;
        }
      `;
      pipWindow.document.head.appendChild(style);

      pipWindow.document.body.innerHTML = `
        <div id="pip-timer" style="cursor:pointer">
          <div class="time" id="pt">--:--</div>
          <div class="speaker" id="ps"></div>
          <div id="pip-hint" style="font-family:'DM Mono',monospace;font-size:9px;
            letter-spacing:.15em;text-transform:uppercase;color:#333;margin-top:4px;">
            tap · start &nbsp; dbl · reset &nbsp; hold · set time
          </div>
        </div>
        <div id="pip-input">
          <input class="pip-min-input" id="pipMinInput" type="number" min="1" max="300" placeholder="10">
          <div class="pip-min-label">minutes — press enter</div>
        </div>
        <div id="pip-msg" style="display:none">
          <div class="msg-text" id="pm"></div>
          <div class="msg-bar" id="pb"></div>
        </div>
      `;

      const pipTimerEl  = pipWindow.document.getElementById('pip-timer');
      const pipInputEl  = pipWindow.document.getElementById('pip-input');
      const pipMinInput = pipWindow.document.getElementById('pipMinInput');
      let pipClickTimer = null;
      let pipHoldTimer  = null;

      function showPipInput() {
        pipTimerEl.style.display = 'none';
        pipInputEl.classList.add('visible');
        pipMinInput.value = '';
        pipMinInput.focus();
      }

      function hidePipInput() {
        pipInputEl.classList.remove('visible');
        pipTimerEl.style.display = 'flex';
      }

      // Confirm duration on Enter
      pipMinInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          const mins = parseInt(pipMinInput.value);
          if (mins >= 1 && mins <= 300) {
            if (!presenterMode) { if (state.presenterLocked) return; setMode('presenter'); }
            sendCtrl({ type: 'set_duration', seconds: mins * 60 });
          }
          hidePipInput();
        }
        if (e.key === 'Escape') hidePipInput();
      });

      // Dismiss on click outside input
      pipMinInput.addEventListener('blur', () => setTimeout(hidePipInput, 150));

      // Long press → show duration input
      pipTimerEl.addEventListener('mousedown', () => {
        pipHoldTimer = setTimeout(() => {
          pipHoldTimer = null;
          clearTimeout(pipClickTimer);
          pipClickTimer = null;
          showPipInput();
        }, 500);
      });

      pipTimerEl.addEventListener('mouseup',    () => clearTimeout(pipHoldTimer));
      pipTimerEl.addEventListener('mouseleave', () => clearTimeout(pipHoldTimer));

      // Single click = start / pause
      pipTimerEl.addEventListener('click', () => {
        if (pipHoldTimer === null && pipClickTimer === null) return; // hold fired
        if (pipClickTimer) return;
        pipClickTimer = setTimeout(() => {
          pipClickTimer = null;
          if (!presenterMode) { if (state.presenterLocked) return; setMode('presenter'); }
          sendCtrl({ type: state.running ? 'pause' : 'start' });
        }, 220);
      });

      // Double click = reset
      pipTimerEl.addEventListener('dblclick', () => {
        clearTimeout(pipClickTimer);
        pipClickTimer = null;
        if (!presenterMode) { if (state.presenterLocked) return; setMode('presenter'); }
        sendCtrl({ type: 'reset' });
      });

      pipBtn.textContent = 'Close Pop Out';
      pipBtn.classList.add('active');
      updatePiP();

      pipWindow.addEventListener('pagehide', () => {
        pipWindow = null;
        pipBtn.textContent = 'Pop Out';
        pipBtn.classList.remove('active');
      });

    } catch(e) {
      pipWindow = null;
      console.error('PiP failed:', e);
    }
  }

  function closePiP() {
    pipWindow?.close();
    pipWindow = null;
    pipBtn.textContent = 'Pop Out';
    pipBtn.classList.remove('active');
  }

  pipBtn.addEventListener('click', () => pipWindow ? closePiP() : openPiP());

  connect();

  setInterval(() => { render(); updatePiP(); }, 500);
</script>
</body>
</html>
