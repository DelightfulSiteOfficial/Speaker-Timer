<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Speaker Timer — Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0a;
    --surface: #141414;
    --border: #222;
    --text: #f0ede8;
    --muted: #555;
    --accent: #e8ff47;
    --danger: #ff4444;
    --warn: #ff9900;
  }

  html {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    height: 100dvh;
    overflow: hidden;
    padding: env(safe-area-inset-top, 12px) 16px calc(env(safe-area-inset-bottom, 0px) + 12px);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  /* ── Name prompt overlay ── */
  .name-prompt {
    position: fixed; inset: 0;
    background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    z-index: 200;
    transition: opacity 0.25s;
  }
  .name-prompt.hidden { opacity: 0; pointer-events: none; }

  .name-prompt-inner {
    width: 100%; max-width: 380px;
    padding: 0 28px;
    display: flex; flex-direction: column; gap: 14px;
  }

  .name-prompt-eyebrow {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .name-prompt-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(48px, 14vw, 64px);
    letter-spacing: 0.02em;
    color: var(--text);
    line-height: 0.95;
    margin-top: -4px;
  }

  .name-prompt-sub {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--muted);
    line-height: 1.6;
  }

  .name-prompt-input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 18px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 20px;
    font-weight: 300;
    outline: none;
    transition: border-color 0.2s;
    margin-top: 6px;
  }
  .name-prompt-input::placeholder { color: var(--muted); font-size: 15px; }
  .name-prompt-input:focus { border-color: var(--accent); }

  .name-prompt-btn {
    height: 62px;
    border-radius: 14px;
    border: none;
    background: var(--accent);
    color: #000;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 30px;
    letter-spacing: 0.06em;
    cursor: pointer;
    transition: all 0.15s;
  }
  .name-prompt-btn:active { transform: scale(0.97); opacity: 0.85; }

  .name-prompt-skip {
    text-align: center;
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    cursor: pointer;
    background: none; border: none;
    padding: 4px;
    transition: color 0.15s;
  }
  .name-prompt-skip:active { color: var(--text); }

  /* ── Header ── */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 0 2px;
    flex-shrink: 0;
  }

  .session-tag {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }

  .header-right { display: flex; align-items: center; gap: 10px; }

  .btn-rooms {
    background: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 12px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.15s;
    min-height: 32px;
  }
  .btn-rooms:active { background: var(--border); color: var(--text); }

  .conn-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--muted);
    transition: background 0.3s;
    flex-shrink: 0;
  }
  .conn-dot.live { background: var(--accent); box-shadow: 0 0 8px var(--accent); }

  /* ── Room chip ── */
  .room-chip {
    background: none;
    border: 1px solid var(--border);
    border-radius: 100px;
    padding: 5px 11px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    cursor: pointer;
    max-width: 110px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: all 0.15s;
    min-height: 28px;
  }
  .room-chip.has-room { color: var(--text); border-color: #333; }
  .room-chip:active { background: var(--border); }

  /* ── Room modal ── */
  .room-modal {
    position: fixed; inset: 0;
    background: rgba(10,10,10,0.88);
    display: flex; align-items: center; justify-content: center;
    z-index: 150;
    opacity: 0; pointer-events: none;
    transition: opacity 0.2s;
  }
  .room-modal.visible { opacity: 1; pointer-events: auto; }

  .room-modal-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 24px 20px 20px;
    width: calc(100% - 40px);
    max-width: 360px;
    display: flex; flex-direction: column; gap: 12px;
  }

  .room-modal-label {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .room-modal-input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 18px;
    font-weight: 300;
    outline: none;
    transition: border-color 0.2s;
  }
  .room-modal-input::placeholder { color: var(--muted); }
  .room-modal-input:focus { border-color: var(--accent); }

  .room-modal-done {
    width: 100%;
    height: 52px;
    border-radius: 12px;
    border: none;
    background: var(--accent);
    color: #000;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 26px;
    letter-spacing: 0.06em;
    cursor: pointer;
    transition: all 0.15s;
  }
  .room-modal-done:active { transform: scale(0.97); opacity: 0.85; }

  /* ── Timer display ── */
  .time-preview {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    flex-shrink: 0;
  }

  .time-big {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(72px, 21vw, 116px);
    line-height: 0.9;
    letter-spacing: -0.01em;
    transition: color 0.4s;
    font-variant-numeric: tabular-nums;
  }
  .time-big.warning { color: var(--warn); }
  .time-big.danger  { color: var(--danger); animation: flash 1s step-end infinite; }
  .time-big.overtime { color: var(--danger); }
  @keyframes flash { 0%,100%{opacity:1} 50%{opacity:0.3} }

  .time-status {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* ── Overtime banner ── */
  .overtime-banner {
    display: none;
    background: var(--danger);
    color: #fff;
    text-align: center;
    padding: 10px;
    border-radius: 10px;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    animation: flashBg 1s step-end infinite;
    flex-shrink: 0;
  }
  @keyframes flashBg { 0%,100%{opacity:1} 50%{opacity:0.5} }
  .overtime-banner.visible { display: block; }

  /* ── Section label ── */
  .section-label {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 5px;
  }

  /* ── Duration dial ── */
  .dial-wrapper {
    position: relative;
    width: min(68%, 240px);
    aspect-ratio: 1;
    margin: 0 0 6px;
  }

  .dial-svg {
    width: 100%; height: 100%;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    cursor: pointer;
    overflow: visible;
  }

  .dial-center-overlay {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    cursor: pointer;
    -webkit-user-select: none;
    user-select: none;
  }

  .dial-value {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 48px;
    line-height: 1;
    color: var(--text);
    letter-spacing: 0.02em;
    transition: color 0.2s;
  }

  .dial-unit {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: -8px;
  }

  .dial-hint {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 4px;
    opacity: 0.6;
  }

  .dial-direct-input {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 120px;
    background: var(--bg);
    border: 2px solid var(--accent);
    border-radius: 14px;
    padding: 6px 10px;
    color: var(--text);
    font-family: 'Bebas Neue', sans-serif;
    font-size: 44px;
    text-align: center;
    outline: none;
    display: none;
    z-index: 10;
    -moz-appearance: textfield;
  }
  .dial-direct-input::-webkit-outer-spin-button,
  .dial-direct-input::-webkit-inner-spin-button { -webkit-appearance: none; }

  .dial-presets {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    width: 100%;
  }

  .dial-preset {
    height: 46px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 14px;
    letter-spacing: 0.06em;
    cursor: pointer;
    transition: all 0.15s;
    display: flex; align-items: center; justify-content: center;
  }
  .dial-preset:active { transform: scale(0.95); }
  .dial-preset.active { background: rgba(232,255,71,0.1); border-color: rgba(232,255,71,0.35); color: var(--accent); }

  /* ── Nudge row ── */
  .nudge-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    flex-shrink: 0;
  }

  .nudge-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    height: 44px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
  }
  .nudge-btn:active { transform: scale(0.95); background: var(--border); }
  .nudge-btn.add { color: var(--accent); border-color: rgba(232,255,71,0.2); background: rgba(232,255,71,0.04); }
  .nudge-btn.sub { color: var(--warn);   border-color: rgba(255,153,0,0.2);  background: rgba(255,153,0,0.04); }

  /* ── Message section ── */
  .message-input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 0 16px;
    height: 44px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 300;
    outline: none;
    transition: border-color 0.2s;
  }
  .message-input::placeholder { color: var(--muted); font-size: 13px; }
  .message-input:focus { border-color: var(--accent); }

  .msg-btn-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 6px;
  }

  .btn-send-msg {
    background: var(--surface);
    border: 1px solid var(--accent);
    border-radius: 12px;
    height: 44px;
    color: var(--accent);
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-send-msg:active { background: rgba(232,255,71,0.08); transform: scale(0.97); }

  .btn-clear-msg {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    height: 44px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-clear-msg:active { background: var(--border); color: var(--text); transform: scale(0.96); }

  .msg-status { display: none; flex-direction: column; gap: 6px; padding: 10px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; margin-top: 6px; }
  .msg-status.visible { display: flex; }
  .msg-status-text { font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
  .msg-status-text.active { color: var(--accent); }
  .msg-status-text.done   { color: var(--muted); }
  .msg-status-bar-track { height: 2px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .msg-status-bar-fill { height: 100%; background: var(--accent); border-radius: 2px; transform-origin: left; transform: scaleX(1); }
  .msg-status-bar-fill.drain { animation: drainCtrl var(--d, 5s) linear forwards; }
  @keyframes drainCtrl { from{transform:scaleX(1)} to{transform:scaleX(0)} }

  /* ── Waiting list ── */
  .waiting-section { display: none; flex-direction: column; gap: 8px; flex-shrink: 0; }
  .waiting-section.visible { display: flex; }

  .waiting-item { display: flex; align-items: center; justify-content: space-between; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px; gap: 12px; min-height: 52px; }
  .waiting-item-name { font-family: 'DM Sans', sans-serif; font-size: 15px; color: var(--text); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .waiting-item-name.unnamed { color: var(--muted); font-style: italic; }

  .btn-pass { background: transparent; border: 1px solid var(--accent); border-radius: 8px; padding: 7px 16px; color: var(--accent); font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; flex-shrink: 0; transition: all 0.15s; min-height: 36px; }
  .btn-pass:active { background: rgba(232,255,71,0.1); transform: scale(0.95); }

  /* ── Lock screen ── */
  .lock-screen {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    padding: 40px 24px;
    border: 1px solid var(--border);
    border-radius: 16px;
    text-align: center;
    flex: 1; min-height: 220px;
    justify-content: center;
  }
  .lock-screen.visible { display: flex; }
  .lock-title { font-family: 'Bebas Neue', sans-serif; font-size: 40px; color: var(--muted); letter-spacing: 0.05em; }
  .lock-sub { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted); letter-spacing: 0.12em; text-transform: uppercase; line-height: 1.7; }
  .waiting-name-input { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 16px; font-weight: 300; outline: none; transition: border-color 0.2s; text-align: center; }
  .waiting-name-input::placeholder { color: var(--muted); font-size: 13px; }
  .waiting-name-input:focus { border-color: var(--accent); }

  .btn-take-control { display: none; width: 100%; padding: 22px; border-radius: 16px; border: 2px solid var(--accent); background: transparent; color: var(--accent); font-family: 'Bebas Neue', sans-serif; font-size: 30px; letter-spacing: 0.06em; cursor: pointer; transition: all 0.15s; flex-shrink: 0; }
  .btn-take-control.visible { display: block; }
  .btn-take-control:active { background: rgba(232,255,71,0.08); transform: scale(0.97); }

  /* ── Dial section ── */
  .dial-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
  }

  /* ── Start / Reset button row ── */
  .action-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .btn-main {
    height: 58px;
    border-radius: 16px;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    letter-spacing: 0.06em;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-main:active { transform: scale(0.96); opacity: 0.85; }

  .btn-start { background: var(--accent); color: #000; }
  .btn-pause  { background: var(--warn);   color: #000; }
  .btn-reset-side {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--muted);
  }
  .btn-reset-side:active { background: var(--border); color: var(--text); transform: scale(0.96); }


  /* ── Control panel (hidden until hasControl) ── */
  .control-panel { display: none; flex-direction: column; gap: 10px; }
  .control-panel.visible { display: flex; }

  /* ── Overlay ── */
  .overlay { position: fixed; inset: 0; background: rgba(10,10,10,0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; z-index: 100; transition: opacity 0.3s; }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .overlay-text { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--muted); letter-spacing: 0.2em; text-transform: uppercase; }
</style>
</head>
<body>

<!-- ── Name prompt (shown on first visit) ── -->
<div class="name-prompt" id="namePrompt">
  <div class="name-prompt-inner">
    <div class="name-prompt-eyebrow">Speaker Timer</div>
    <div class="name-prompt-title">What's your name?</div>
    <div class="name-prompt-sub">Used when passing control to another device. You can change it any time.</div>
    <input class="name-prompt-input" id="namePromptInput" type="text" placeholder="Your name…" maxlength="40" autocomplete="name">
    <button class="name-prompt-btn" id="namePromptBtn">Get Started →</button>
    <button class="name-prompt-skip" id="namePromptSkip">Skip for now</button>
  </div>
</div>

<!-- ── Header ── -->
<div class="header">
  <div class="session-tag" id="sessionTag">Session —</div>
  <div class="header-right">
    <button class="room-chip" id="roomChip">Set room…</button>
    <button class="btn-rooms" id="roomsBtn">All Rooms</button>
    <div class="conn-dot" id="connDot"></div>
  </div>
</div>

<!-- ── Timer ── -->
<div class="time-preview">
  <div class="time-big" id="timeBig">--:--</div>
  <span class="time-status" id="timeStatus">Stopped</span>
</div>

<!-- ── Room name modal ── -->
<div class="room-modal" id="roomModal">
  <div class="room-modal-box">
    <div class="room-modal-label">Room name</div>
    <input class="room-modal-input" id="speakerInput" type="text" placeholder="e.g. Ballroom A, Room 101…" maxlength="60">
    <button class="room-modal-done" id="roomModalDone">Done</button>
  </div>
</div>

<!-- ── Overtime banner ── -->
<div class="overtime-banner" id="overtimeBanner">⚠ Speaker is over time</div>

<!-- ── Main control panel (only when hasControl) ── -->
<div class="control-panel" id="controlPanel">

  <!-- Dial -->
  <div class="dial-area">
    <div class="dial-wrapper">
      <svg class="dial-svg" id="durationDial" viewBox="0 0 240 240">
        <path id="dialBgArc" fill="none" stroke="#1a1a1a" stroke-width="10" stroke-linecap="round"
              d="M 72.00 203.08 A 96 96 0 1 1 168.00 203.08"/>
        <path id="dialArc" fill="none" stroke="#e8ff47" stroke-width="10" stroke-linecap="round"/>
        <circle id="dialThumb" r="14" fill="#e8ff47"/>
      </svg>
      <div class="dial-center-overlay" id="dialCenterOverlay">
        <div class="dial-value" id="dialValue">10</div>
        <div class="dial-unit">min</div>
        <div class="dial-hint">tap to type</div>
      </div>
      <input class="dial-direct-input" id="dialDirectInput" type="number" min="1" max="300">
    </div>
    <div class="dial-presets">
      <button class="dial-preset" data-mins="15">15m</button>
      <button class="dial-preset" data-mins="20">20m</button>
      <button class="dial-preset" data-mins="30">30m</button>
      <button class="dial-preset" data-mins="45">45m</button>
    </div>
  </div>

  <!-- Start / Reset -->
  <div class="action-row">
    <button class="btn-main btn-start" id="mainBtn">Start</button>
    <button class="btn-main btn-reset-side" id="resetBtn">Reset</button>
  </div>

  <!-- Nudge -->
  <div class="nudge-row">
    <button class="nudge-btn sub" data-nudge="-60">−1m</button>
    <button class="nudge-btn sub" data-nudge="-30">−30s</button>
    <button class="nudge-btn add" data-nudge="30">+30s</button>
    <button class="nudge-btn add" data-nudge="60">+1m</button>
  </div>

  <!-- Message flash -->
  <div>
    <div class="section-label">Message on display</div>
    <input class="message-input" id="messageInput" type="text" placeholder="Flash a message to the presenter…" maxlength="200">
    <div class="msg-btn-row">
      <button class="btn-send-msg" id="sendMsgBtn">Send</button>
      <button class="btn-clear-msg" id="clearMsgBtn">Clear</button>
    </div>
    <div class="msg-status" id="msgStatus">
      <div class="msg-status-text" id="msgStatusText"></div>
      <div class="msg-status-bar-track" id="msgBarTrack" style="display:none">
        <div class="msg-status-bar-fill" id="msgBarFill"></div>
      </div>
    </div>
  </div>

  <!-- Waiting list -->
  <div class="waiting-section" id="waitingSection">
    <div class="section-label">Waiting to control</div>
    <div id="waitingList"></div>
  </div>


</div>

<!-- ── Lock screen (when someone else has control) ── -->
<div class="lock-screen" id="lockScreen">
  <div class="lock-title">Control Active</div>
  <div class="lock-sub">Another device is controlling<br>this session</div>
  <input class="waiting-name-input" id="waitingNameInput" type="text" placeholder="Enter your name so they can pass to you…" maxlength="40">
</div>

<button class="btn-take-control" id="takeControlBtn">Take Control</button>

<div class="overlay" id="overlay">
  <div class="overlay-text">Connecting…</div>
</div>

<script>
  const SERVER_URL = window.SPEAKER_TIMER_SERVER || 'wss://speaker-timer-production.up.railway.app';
  const params = new URLSearchParams(window.location.search);
  const sessionId = params.get('session') || 'NOSESSION';
  const MY_NAME_KEY      = 'speakerTimerMyName';
  const NAME_PROMPTED_KEY = 'speakerTimerNamePromptSeen';

  let state = {
    running: false, timeRemaining: 0, totalTime: 0, roomName: '',
    overtime: false, waitingList: [], message: '', runCount: 0,
  };
  let hasControl       = false;
  let controlAvailable = false;
  let waitingId        = null;

  // ── DOM ────────────────────────────────────────────────────────────────────
  const timeBig          = document.getElementById('timeBig');
  const timeStatus       = document.getElementById('timeStatus');
  const mainBtn          = document.getElementById('mainBtn');
  const resetBtn         = document.getElementById('resetBtn');
  const speakerInput     = document.getElementById('speakerInput');
  const connDot          = document.getElementById('connDot');
  const overlay          = document.getElementById('overlay');
  const overtimeBanner   = document.getElementById('overtimeBanner');
  const sessionTag       = document.getElementById('sessionTag');
  const controlPanel     = document.getElementById('controlPanel');
  const lockScreen       = document.getElementById('lockScreen');
  const takeControlBtn   = document.getElementById('takeControlBtn');
  const waitingSection   = document.getElementById('waitingSection');
  const waitingListEl    = document.getElementById('waitingList');
  const waitingNameInput = document.getElementById('waitingNameInput');

  sessionTag.textContent = `Session ${sessionId}`;

  // ── Name prompt ────────────────────────────────────────────────────────────
  const namePrompt      = document.getElementById('namePrompt');
  const namePromptInput = document.getElementById('namePromptInput');
  const namePromptBtn   = document.getElementById('namePromptBtn');
  const namePromptSkip  = document.getElementById('namePromptSkip');

  const savedMyName     = localStorage.getItem(MY_NAME_KEY) || '';
  const promptAlreadySeen = !!localStorage.getItem(NAME_PROMPTED_KEY);

  function dismissNamePrompt(name) {
    localStorage.setItem(NAME_PROMPTED_KEY, '1');
    if (name) localStorage.setItem(MY_NAME_KEY, name);
    waitingNameInput.value = name || savedMyName;
    namePrompt.classList.add('hidden');
  }

  if (promptAlreadySeen) {
    // Already been through the prompt before — skip straight in
    waitingNameInput.value = savedMyName;
    namePrompt.classList.add('hidden');
  } else {
    // First visit — show prompt, pre-fill any previously saved name
    namePromptInput.value = savedMyName;
    setTimeout(() => { namePromptInput.focus(); namePromptInput.select(); }, 100);
  }

  namePromptBtn.addEventListener('click', () =>
    dismissNamePrompt(namePromptInput.value.trim()));

  namePromptInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') dismissNamePrompt(namePromptInput.value.trim());
  });

  namePromptSkip.addEventListener('click', () => dismissNamePrompt(''));

  // ── All Rooms ──────────────────────────────────────────────────────────────
  document.getElementById('roomsBtn').addEventListener('click', () => {
    try {
      const rooms = JSON.parse(localStorage.getItem('speakerTimerRooms')) || [];
      if (!rooms.includes(sessionId)) {
        rooms.push(sessionId);
        localStorage.setItem('speakerTimerRooms', JSON.stringify(rooms));
      }
    } catch {}
    window.location.href = '/hub/';
  });

  // ── Helpers ────────────────────────────────────────────────────────────────
  function formatTime(s) {
    if (!Number.isFinite(s)) return '--:--';
    const abs = Math.abs(s);
    const m = Math.floor(abs / 60);
    const sec = abs % 60;
    return `${s < 0 ? '-' : ''}${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
  }

  function escHtml(s) {
    return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // ── Room chip / modal ──────────────────────────────────────────────────────
  const roomChip      = document.getElementById('roomChip');
  const roomModal     = document.getElementById('roomModal');
  const roomModalDone = document.getElementById('roomModalDone');

  function openRoomModal() {
    roomModal.classList.add('visible');
    setTimeout(() => { speakerInput.focus(); speakerInput.select(); }, 80);
  }

  function closeRoomModal() {
    roomModal.classList.remove('visible');
    send({ type: 'set_room', sessionId, name: speakerInput.value.trim() });
  }

  roomChip.addEventListener('click', openRoomModal);
  roomModalDone.addEventListener('click', closeRoomModal);
  roomModal.addEventListener('click', e => { if (e.target === roomModal) closeRoomModal(); });
  speakerInput.addEventListener('keydown', e => { if (e.key === 'Enter') closeRoomModal(); });

  // ── Main render ────────────────────────────────────────────────────────────
  function render() {
    const { running, timeRemaining, overtime, roomName } = state;
    const isWarning = timeRemaining <= 60 && timeRemaining > 0 && !overtime;
    const isDanger  = timeRemaining <= 30 && timeRemaining > 0 && !overtime;

    timeBig.textContent = formatTime(timeRemaining);
    timeBig.className = 'time-big' +
      (overtime ? ' overtime' : isDanger ? ' danger' : isWarning ? ' warning' : '');
    timeStatus.textContent = running ? 'Running' : (overtime ? 'Overtime' : 'Paused');

    roomChip.textContent = roomName || 'Set room…';
    roomChip.classList.toggle('has-room', !!roomName);

    mainBtn.textContent = running ? 'Pause' : 'Start';
    mainBtn.className = 'btn-main ' + (running ? 'btn-pause' : 'btn-start');

    overtimeBanner.className = 'overtime-banner' + (overtime && hasControl ? ' visible' : '');

    controlPanel.classList.toggle('visible', hasControl);
    lockScreen.classList.toggle('visible', !hasControl);
    takeControlBtn.classList.toggle('visible', !hasControl && controlAvailable);

    // Waiting list
    const wl = state.waitingList || [];
    waitingSection.classList.toggle('visible', hasControl && wl.length > 0);
    waitingListEl.innerHTML = wl.map(p => `
      <div class="waiting-item">
        <span class="waiting-item-name ${p.name ? '' : 'unnamed'}">${escHtml(p.name) || 'Unknown device'}</span>
        <button class="btn-pass" data-id="${p.id}">Pass</button>
      </div>
    `).join('');
    waitingListEl.querySelectorAll('.btn-pass').forEach(btn => {
      btn.addEventListener('click', () =>
        send({ type: 'pass_control_to', sessionId, targetId: btn.dataset.id })
      );
    });
  }

  // ── Duration dial ──────────────────────────────────────────────────────────
  const DIAL_MAX   = 90;
  const DIAL_START = 210;
  const DIAL_SWEEP = 300;
  const DIAL_R     = 96;

  const durationDial      = document.getElementById('durationDial');
  const dialArcEl         = document.getElementById('dialArc');
  const dialThumb         = document.getElementById('dialThumb');
  const dialValue         = document.getElementById('dialValue');
  const dialCenterOverlay = document.getElementById('dialCenterOverlay');
  const dialDirectInput   = document.getElementById('dialDirectInput');

  let dialMins    = 10;
  let dialDragging = false;

  function dialPolarToXY(angleDeg, r) {
    const rad = angleDeg * Math.PI / 180;
    return [120 + r * Math.sin(rad), 120 - r * Math.cos(rad)];
  }

  function dialDescribeArc(fromAngle, toAngle, r) {
    const [sx, sy] = dialPolarToXY(fromAngle, r);
    const [ex, ey] = dialPolarToXY(toAngle, r);
    const sweep = ((toAngle - fromAngle) + 360) % 360 || 360;
    const largeArc = sweep > 180 ? 1 : 0;
    return `M ${sx.toFixed(2)} ${sy.toFixed(2)} A ${r} ${r} 0 ${largeArc} 1 ${ex.toFixed(2)} ${ey.toFixed(2)}`;
  }

  function updateDial(mins, sendUpdate) {
    mins = Math.max(1, Math.min(300, Math.round(mins)));
    dialMins = mins;
    const displayMins = Math.min(mins, DIAL_MAX);
    const endAngle = (DIAL_START + (displayMins / DIAL_MAX) * DIAL_SWEEP) % 360;
    dialArcEl.setAttribute('d', dialDescribeArc(DIAL_START, endAngle, DIAL_R));
    const [tx, ty] = dialPolarToXY(endAngle, DIAL_R);
    dialThumb.setAttribute('cx', tx.toFixed(2));
    dialThumb.setAttribute('cy', ty.toFixed(2));
    dialValue.textContent = mins;
    document.querySelectorAll('.dial-preset').forEach(btn => {
      btn.classList.toggle('active', parseInt(btn.dataset.mins) === mins);
    });
    if (sendUpdate) send({ type: 'set_duration', sessionId, seconds: mins * 60 });
  }

  function clientToDialCoords(e) {
    const rect = durationDial.getBoundingClientRect();
    return [
      (e.clientX - rect.left) * (240 / rect.width),
      (e.clientY - rect.top)  * (240 / rect.height),
    ];
  }

  function coordsToMins(cx, cy) {
    const dx = cx - 120, dy = cy - 120;
    let angle = Math.atan2(dx, -dy) * 180 / Math.PI;
    angle = ((angle % 360) + 360) % 360;
    let offset = ((angle - DIAL_START) + 360) % 360;
    if (offset > DIAL_SWEEP) {
      offset = offset < (DIAL_SWEEP + (360 - DIAL_SWEEP) / 2) ? DIAL_SWEEP : 0;
    }
    return Math.max(1, (offset / DIAL_SWEEP) * DIAL_MAX);
  }

  durationDial.addEventListener('pointerdown', e => {
    if (!hasControl) return;
    dialDragging = true;
    durationDial.setPointerCapture(e.pointerId);
    const [cx, cy] = clientToDialCoords(e);
    updateDial(Math.round(coordsToMins(cx, cy) / 5) * 5 || 5, false);
    e.preventDefault();
  });

  durationDial.addEventListener('pointermove', e => {
    if (!dialDragging) return;
    const [cx, cy] = clientToDialCoords(e);
    updateDial(Math.round(coordsToMins(cx, cy) / 5) * 5 || 5, false);
    e.preventDefault();
  });

  durationDial.addEventListener('pointerup', e => {
    if (!dialDragging) return;
    dialDragging = false;
    durationDial.releasePointerCapture(e.pointerId);
    send({ type: 'set_duration', sessionId, seconds: dialMins * 60 });
  });

  durationDial.addEventListener('pointercancel', e => {
    if (dialDragging) { dialDragging = false; durationDial.releasePointerCapture(e.pointerId); }
  });

  dialCenterOverlay.addEventListener('click', () => {
    if (!hasControl) return;
    dialDirectInput.value = dialMins;
    dialDirectInput.style.display = 'block';
    dialDirectInput.focus();
    dialDirectInput.select();
  });

  dialDirectInput.addEventListener('blur', () => {
    const val = parseInt(dialDirectInput.value);
    dialDirectInput.style.display = 'none';
    if (val >= 1 && val <= 300) updateDial(val, true);
  });

  dialDirectInput.addEventListener('keydown', e => {
    if (e.key === 'Enter')  dialDirectInput.blur();
    if (e.key === 'Escape') dialDirectInput.style.display = 'none';
  });

  document.querySelectorAll('.dial-preset').forEach(btn => {
    btn.addEventListener('click', () => {
      if (!hasControl) return;
      updateDial(parseInt(btn.dataset.mins), true);
    });
  });

  updateDial(10, false);

  // ── Waiting name input (lock screen) ──────────────────────────────────────
  let waitingNameTimer;
  waitingNameInput.addEventListener('input', () => {
    const name = waitingNameInput.value.trim();
    if (name) localStorage.setItem(MY_NAME_KEY, name);
    clearTimeout(waitingNameTimer);
    waitingNameTimer = setTimeout(() => {
      if (waitingId) send({ type: 'set_waiting_name', waitingId, name });
    }, 500);
  });

  // ── Main / Reset ───────────────────────────────────────────────────────────
  mainBtn.addEventListener('click', () =>
    send({ type: state.running ? 'pause' : 'start', sessionId }));

  resetBtn.addEventListener('click', () =>
    send({ type: 'reset', sessionId }));

  // ── Nudge ──────────────────────────────────────────────────────────────────
  document.querySelectorAll('[data-nudge]').forEach(btn =>
    btn.addEventListener('click', () =>
      send({ type: 'nudge', sessionId, delta: parseInt(btn.dataset.nudge) })));

  // ── Message ────────────────────────────────────────────────────────────────
  const messageInput  = document.getElementById('messageInput');
  const sendMsgBtn    = document.getElementById('sendMsgBtn');
  const clearMsgBtn   = document.getElementById('clearMsgBtn');
  const msgStatus     = document.getElementById('msgStatus');
  const msgStatusText = document.getElementById('msgStatusText');
  const msgBarTrack   = document.getElementById('msgBarTrack');
  const msgBarFill    = document.getElementById('msgBarFill');
  const FLASH_MS      = 5000;
  let msgCountInterval = null, msgCountSecs = 0, msgDoneTimer = null;

  function setMsgStatus(type, secs) {
    msgStatus.classList.add('visible');
    clearTimeout(msgDoneTimer);
    if (type === 'displaying') {
      msgStatusText.textContent = `Showing on display — ${secs}s`;
      msgStatusText.className = 'msg-status-text active';
      msgBarTrack.style.display = '';
      msgBarFill.classList.remove('drain');
      msgBarFill.style.setProperty('--d', (FLASH_MS / 1000) + 's');
      void msgBarFill.offsetWidth;
      msgBarFill.classList.add('drain');
    } else if (type === 'autodismissed') {
      msgStatusText.textContent = 'Auto-dismissed ✓';
      msgStatusText.className = 'msg-status-text done';
      msgBarTrack.style.display = 'none';
      msgDoneTimer = setTimeout(() => msgStatus.classList.remove('visible'), 3000);
    } else if (type === 'cleared') {
      msgStatusText.textContent = 'Message cleared ✓';
      msgStatusText.className = 'msg-status-text done';
      msgBarTrack.style.display = 'none';
      msgDoneTimer = setTimeout(() => msgStatus.classList.remove('visible'), 3000);
    }
  }

  function startMsgCountdown() {
    clearInterval(msgCountInterval);
    msgCountSecs = Math.ceil(FLASH_MS / 1000);
    setMsgStatus('displaying', msgCountSecs);
    msgCountInterval = setInterval(() => {
      msgCountSecs--;
      if (msgCountSecs <= 0) {
        clearInterval(msgCountInterval);
        setMsgStatus('autodismissed');
      } else {
        msgStatusText.textContent = `Showing on display — ${msgCountSecs}s`;
      }
    }, 1000);
  }

  sendMsgBtn.addEventListener('click', () => {
    const text = messageInput.value.trim();
    if (!text) return;
    send({ type: 'set_message', sessionId, text });
    messageInput.blur();
    sendMsgBtn.textContent = '✓ Sent';
    setTimeout(() => { sendMsgBtn.textContent = 'Send'; }, 1500);
  });

  messageInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendMsgBtn.click(); });

  clearMsgBtn.addEventListener('click', () => {
    messageInput.value = '';
    send({ type: 'set_message', sessionId, text: '' });
  });

  // ── Control lock ───────────────────────────────────────────────────────────
  takeControlBtn.addEventListener('click', () => {
    controlAvailable = false;
    send({ type: 'claim_control', sessionId });
    render();
  });


  // ── WebSocket ──────────────────────────────────────────────────────────────
  let ws, reconnectTimer;

  function send(msg) {
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(msg));
  }

  function scheduleReconnect() {
    connDot.classList.remove('live');
    clearTimeout(reconnectTimer);
    reconnectTimer = setTimeout(connect, 3000);
  }

  function connect() {
    try {
      ws = new WebSocket(`${SERVER_URL}?session=${sessionId}&role=control`);
    } catch(e) { scheduleReconnect(); return; }

    ws.onopen = () => {
      overlay.classList.add('hidden');
      connDot.classList.add('live');
    };

    ws.onmessage = (e) => {
      try {
        const msg = JSON.parse(e.data);
        if (msg.type === 'state') {
          const prevMessage = state.message;
          state = { ...state, ...msg.payload };

          if (msg.payload.totalTime !== undefined && !dialDragging)
            updateDial(Math.max(1, Math.round(state.totalTime / 60)), false);

          if (msg.payload.roomName !== undefined && !roomModal.classList.contains('visible'))
            speakerInput.value = msg.payload.roomName || '';

          if (msg.payload.message !== undefined && document.activeElement !== messageInput)
            messageInput.value = msg.payload.message || '';

          if (state.message && state.message !== prevMessage) startMsgCountdown();
          else if (!state.message && prevMessage) { clearInterval(msgCountInterval); setMsgStatus('cleared'); }

          render();

        } else if (msg.type === 'control_granted') {
          hasControl = true;
          waitingId = null;
          controlAvailable = false;
          render();

        } else if (msg.type === 'control_denied') {
          hasControl = false;
          waitingId = msg.waitingId;
          const myName = localStorage.getItem(MY_NAME_KEY) || '';
          if (myName) send({ type: 'set_waiting_name', waitingId, name: myName });
          render();

        } else if (msg.type === 'control_available') {
          controlAvailable = true;
          render();

        } else if (msg.type === 'waiting_list') {
          state.waitingList = msg.list || [];
          render();
        }
      } catch {}
    };

    ws.onclose = scheduleReconnect;
    ws.onerror = scheduleReconnect;
  }

  connect();
</script>
</body>
</html>
