<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Speaker Timer — Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0a;
    --surface: #141414;
    --border: #222;
    --text: #f0ede8;
    --muted: #555;
    --accent: #e8ff47;
    --danger: #ff4444;
    --warn: #ff9900;
  }

  html {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    min-height: 100dvh;
    padding: env(safe-area-inset-top, 16px) 16px 0;
    /* bottom padding added dynamically once sticky height is known */
    padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 140px);
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  /* ── Header ── */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 0 2px;
    flex-shrink: 0;
  }

  .session-tag {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .btn-rooms {
    background: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 12px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.15s;
    min-height: 32px;
  }

  .btn-rooms:active { background: var(--border); color: var(--text); }

  .conn-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--muted);
    transition: background 0.3s;
    flex-shrink: 0;
  }

  .conn-dot.live {
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
  }

  /* ── Time display ── */
  .time-preview {
    text-align: center;
    padding: 4px 0;
    flex-shrink: 0;
  }

  .time-big {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(80px, 22vw, 130px);
    line-height: 0.95;
    letter-spacing: -0.01em;
    transition: color 0.4s;
    font-variant-numeric: tabular-nums;
  }

  .time-big.warning { color: var(--warn); }
  .time-big.danger  { color: var(--danger); animation: flash 1s step-end infinite; }
  .time-big.overtime { color: var(--danger); }

  @keyframes flash {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .time-status {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 6px;
  }

  /* ── Section label ── */
  .field-label {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }

  /* ── Speaker name ── */
  .speaker-row { flex-shrink: 0; }

  .speaker-input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 16px;
    font-weight: 300;
    outline: none;
    transition: border-color 0.2s;
    min-height: 52px;
  }

  .speaker-input::placeholder { color: var(--muted); }
  .speaker-input:focus { border-color: var(--accent); }

  /* ── Duration picker ── */
  .duration-row { flex-shrink: 0; }

  .duration-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }

  .dur-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0;
    height: 48px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.04em;
    cursor: pointer;
    transition: all 0.15s;
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .dur-btn:active { transform: scale(0.95); }
  .dur-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #000;
    font-weight: 500;
  }

  .custom-row {
    display: flex;
    gap: 8px;
    margin-top: 8px;
  }

  .custom-input {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0 14px;
    height: 48px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s;
  }

  .custom-input::placeholder { color: var(--muted); font-size: 12px; }
  .custom-input:focus { border-color: var(--accent); }

  .custom-set {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0 18px;
    height: 48px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.1em;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }

  .custom-set:active { transform: scale(0.95); background: var(--border); }

  /* ── Nudge ── */
  .nudge-row {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 6px;
    flex-shrink: 0;
  }

  .nudge-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    height: 48px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    cursor: pointer;
    text-align: center;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 2px;
  }

  .nudge-btn:active { transform: scale(0.95); background: var(--border); }
  .nudge-btn.add { color: var(--accent); border-color: rgba(232,255,71,0.15); }
  .nudge-btn.sub { color: var(--warn);   border-color: rgba(255,153,0,0.15); }

  /* ── Overtime banner ── */
  .overtime-banner {
    display: none;
    background: var(--danger);
    color: #fff;
    text-align: center;
    padding: 12px;
    border-radius: 12px;
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    animation: flashBg 1s step-end infinite;
    flex-shrink: 0;
  }

  @keyframes flashBg {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  .overtime-banner.visible { display: block; }

  /* ── Control lock ── */
  .lock-banner {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 36px 24px;
    border: 1px solid var(--border);
    border-radius: 16px;
    text-align: center;
    flex: 1;
    min-height: 200px;
  }

  .lock-banner.visible { display: flex; }

  .lock-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 40px;
    color: var(--muted);
    letter-spacing: 0.05em;
  }

  .lock-sub {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    line-height: 1.7;
  }

  .waiting-name-input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 16px;
    font-weight: 300;
    outline: none;
    transition: border-color 0.2s;
    text-align: center;
  }

  .waiting-name-input::placeholder { color: var(--muted); font-size: 13px; }
  .waiting-name-input:focus { border-color: var(--accent); }

  /* ── Waiting list ── */
  .waiting-section {
    display: none;
    flex-direction: column;
    gap: 8px;
    flex-shrink: 0;
  }

  .waiting-section.visible { display: flex; }

  .waiting-section-label {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .waiting-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 16px;
    gap: 12px;
    min-height: 52px;
  }

  .waiting-item-name {
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    color: var(--text);
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .waiting-item-name.unnamed { color: var(--muted); font-style: italic; }

  .btn-pass {
    background: transparent;
    border: 1px solid var(--accent);
    border-radius: 8px;
    padding: 7px 16px;
    color: var(--accent);
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    flex-shrink: 0;
    transition: all 0.15s;
    min-height: 36px;
  }

  .btn-pass:active { background: rgba(232,255,71,0.1); transform: scale(0.95); }

  /* ── Take control button ── */
  .btn-take-control {
    display: none;
    width: 100%;
    padding: 22px;
    border-radius: 16px;
    border: 2px solid var(--accent);
    background: transparent;
    color: var(--accent);
    font-family: 'Bebas Neue', sans-serif;
    font-size: 30px;
    letter-spacing: 0.06em;
    cursor: pointer;
    transition: all 0.15s;
    flex-shrink: 0;
  }

  .btn-take-control.visible { display: block; }
  .btn-take-control:active { background: rgba(232,255,71,0.08); transform: scale(0.97); }

  /* ── Operator message ── */
  .message-row { flex-shrink: 0; }

  .message-input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 16px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 300;
    outline: none;
    transition: border-color 0.2s;
    min-height: 48px;
  }

  .message-input::placeholder { color: var(--muted); font-size: 13px; }
  .message-input:focus { border-color: var(--accent); }

  .message-btns {
    display: flex;
    gap: 8px;
    margin-top: 8px;
  }

  .btn-send-msg {
    flex: 2;
    background: var(--surface);
    border: 1px solid var(--accent);
    border-radius: 12px;
    padding: 0 16px;
    height: 48px;
    color: var(--accent);
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.15s;
  }

  .btn-send-msg:active { background: rgba(232,255,71,0.08); transform: scale(0.97); }

  .btn-clear-msg {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 0 16px;
    height: 48px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.15s;
  }

  .btn-clear-msg:active { background: var(--border); }

  /* ── Message status strip ── */
  .msg-status {
    display: none;
    flex-direction: column;
    gap: 6px;
    padding: 10px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-top: 4px;
  }

  .msg-status.visible { display: flex; }

  .msg-status-text {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .msg-status-text.active { color: var(--accent); }
  .msg-status-text.done   { color: var(--muted); }

  .msg-status-bar-track {
    height: 2px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }

  .msg-status-bar-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    transform-origin: left;
    transform: scaleX(1);
  }

  .msg-status-bar-fill.drain {
    animation: drainCtrl var(--d, 5s) linear forwards;
  }

  @keyframes drainCtrl {
    from { transform: scaleX(1); }
    to   { transform: scaleX(0); }
  }

  /* ── Sticky controls ── */
  .controls-sticky {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 12px 16px calc(env(safe-area-inset-bottom, 0px) + 12px);
    background: var(--bg);
    border-top: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 8px;
    z-index: 20;
  }

  .controls {
    display: flex;
    gap: 10px;
  }

  .btn-main {
    flex: 2;
    padding: 0;
    height: 60px;
    border-radius: 14px;
    border: none;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 30px;
    letter-spacing: 0.06em;
    cursor: pointer;
    transition: all 0.15s;
  }

  .btn-main:active { transform: scale(0.97); }
  .btn-start { background: var(--accent); color: #000; }
  .btn-pause { background: var(--warn);   color: #000; }

  .btn-reset {
    flex: 1;
    height: 60px;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.15s;
  }

  .btn-reset:active { transform: scale(0.97); background: var(--border); }

  .btn-release {
    display: none;
    width: 100%;
    padding: 6px;
    background: none;
    border: none;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    cursor: pointer;
    text-align: center;
  }

  .btn-release.visible { display: block; }
  .btn-release:active { color: var(--text); }

  /* ── Disconnected overlay ── */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(10,10,10,0.95);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    z-index: 100;
    transition: opacity 0.3s;
  }

  .overlay.hidden { opacity: 0; pointer-events: none; }

  .overlay-text {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }
</style>
</head>
<body>

<div class="header">
  <div class="session-tag" id="sessionTag">Session —</div>
  <div class="header-right">
    <button class="btn-rooms" id="roomsBtn">All Rooms</button>
    <div class="conn-dot" id="connDot"></div>
  </div>
</div>

<div class="time-preview">
  <div class="time-big" id="timeBig">--:--</div>
  <div class="time-status" id="timeStatus">Stopped</div>
</div>

<div class="speaker-row">
  <div class="field-label">Speaker name</div>
  <input class="speaker-input" id="speakerInput" type="text" placeholder="Enter speaker name…" maxlength="60">
</div>

<div class="duration-row">
  <div class="field-label">Duration</div>
  <div class="duration-grid">
    <button class="dur-btn" data-mins="5">5 min</button>
    <button class="dur-btn" data-mins="10">10 min</button>
    <button class="dur-btn" data-mins="15">15 min</button>
    <button class="dur-btn" data-mins="20">20 min</button>
    <button class="dur-btn" data-mins="30">30 min</button>
    <button class="dur-btn" data-mins="45">45 min</button>
    <button class="dur-btn" data-mins="60">60 min</button>
    <button class="dur-btn" data-mins="90">90 min</button>
  </div>
  <div class="custom-row">
    <input class="custom-input" id="customMins" type="number" placeholder="Custom minutes…" min="1" max="300">
    <button class="custom-set" id="customSetBtn">Set</button>
  </div>
</div>

<div class="nudge-row">
  <button class="nudge-btn sub" data-nudge="-300">−5m</button>
  <button class="nudge-btn sub" data-nudge="-60">−1m</button>
  <button class="nudge-btn sub" data-nudge="-30">−30s</button>
  <button class="nudge-btn add" data-nudge="30">+30s</button>
  <button class="nudge-btn add" data-nudge="60">+1m</button>
  <button class="nudge-btn add" data-nudge="300">+5m</button>
</div>

<div class="overtime-banner" id="overtimeBanner">⚠ Speaker is over time</div>

<div class="lock-banner" id="lockBanner">
  <div class="lock-title">Control Active</div>
  <div class="lock-sub">Another device is controlling<br>this session</div>
  <input class="waiting-name-input" id="waitingNameInput" type="text" placeholder="Enter your name so they can pass to you…" maxlength="40">
</div>

<div class="waiting-section" id="waitingSection">
  <div class="waiting-section-label">Waiting to control</div>
  <div id="waitingList"></div>
</div>

<button class="btn-take-control" id="takeControlBtn">Take Control</button>

<div class="message-row">
  <div class="field-label">Message on display</div>
  <input class="message-input" id="messageInput" type="text" placeholder="Type a message for the presenter…" maxlength="200">
  <div class="message-btns">
    <button class="btn-send-msg" id="sendMsgBtn">Send to Display</button>
    <button class="btn-clear-msg" id="clearMsgBtn">Clear</button>
  </div>
  <div class="msg-status" id="msgStatus">
    <div class="msg-status-text" id="msgStatusText"></div>
    <div class="msg-status-bar-track" id="msgBarTrack" style="display:none">
      <div class="msg-status-bar-fill" id="msgBarFill"></div>
    </div>
  </div>
</div>

<div class="controls-sticky">
  <div class="controls">
    <button class="btn-main btn-start" id="mainBtn">Start</button>
    <button class="btn-reset" id="resetBtn">Reset</button>
  </div>
  <button class="btn-release" id="releaseBtn">Release Control</button>
</div>

<div class="overlay" id="overlay">
  <div class="overlay-text">Connecting…</div>
</div>

<script>
  const SERVER_URL = window.SPEAKER_TIMER_SERVER || 'wss://speaker-timer-production.up.railway.app';
  const params = new URLSearchParams(window.location.search);
  const sessionId = params.get('session') || 'NOSESSION';

  let state = { running: false, timeRemaining: 0, totalTime: 0, speakerName: '', overtime: false, waitingList: [] };
  let selectedMins = null;
  let hasControl = false;
  let controlAvailable = false;
  let waitingId = null;

  // DOM
  const timeBig           = document.getElementById('timeBig');
  const timeStatus        = document.getElementById('timeStatus');
  const mainBtn           = document.getElementById('mainBtn');
  const resetBtn          = document.getElementById('resetBtn');
  const speakerInput      = document.getElementById('speakerInput');
  const connDot           = document.getElementById('connDot');
  const overlay           = document.getElementById('overlay');
  const overtimeBanner    = document.getElementById('overtimeBanner');
  const sessionTag        = document.getElementById('sessionTag');
  const lockBanner        = document.getElementById('lockBanner');
  const takeControlBtn    = document.getElementById('takeControlBtn');
  const releaseBtn        = document.getElementById('releaseBtn');
  const waitingSection    = document.getElementById('waitingSection');
  const waitingListEl     = document.getElementById('waitingList');
  const waitingNameInput  = document.getElementById('waitingNameInput');

  sessionTag.textContent = `Session ${sessionId}`;

  // All Rooms button — save this room and go to hub
  document.getElementById('roomsBtn').addEventListener('click', () => {
    try {
      const rooms = JSON.parse(localStorage.getItem('speakerTimerRooms')) || [];
      if (!rooms.includes(sessionId)) {
        rooms.push(sessionId);
        localStorage.setItem('speakerTimerRooms', JSON.stringify(rooms));
      }
    } catch {}
    window.location.href = '/';
  });

  function formatTime(s) {
    if (s == null || isNaN(s)) return '--:--';
    const abs = Math.abs(s);
    const m = Math.floor(abs / 60);
    const sec = abs % 60;
    return `${s < 0 ? '-' : ''}${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
  }

  function render() {
    const { running, timeRemaining, overtime } = state;
    const isWarning = timeRemaining <= 60 && timeRemaining > 0 && !overtime;
    const isDanger  = timeRemaining <= 30 && timeRemaining > 0 && !overtime;

    timeBig.textContent = formatTime(timeRemaining);
    timeBig.className = 'time-big' +
      (overtime ? ' overtime' : isDanger ? ' danger' : isWarning ? ' warning' : '');

    timeStatus.textContent = running ? 'Running' : (overtime ? 'Overtime' : 'Paused');

    mainBtn.textContent = running ? 'Pause' : 'Start';
    mainBtn.className = 'btn-main ' + (running ? 'btn-pause' : 'btn-start');

    overtimeBanner.className = 'overtime-banner' + (overtime && hasControl ? ' visible' : '');

    // Lock state
    document.querySelector('.speaker-row').style.display  = hasControl ? '' : 'none';
    document.querySelector('.duration-row').style.display = hasControl ? '' : 'none';
    document.querySelector('.nudge-row').style.display    = hasControl ? '' : 'none';
    document.querySelector('.controls').style.display     = hasControl ? '' : 'none';
    releaseBtn.className     = 'btn-release'      + (hasControl ? ' visible' : '');
    lockBanner.className     = 'lock-banner'      + (!hasControl ? ' visible' : '');
    takeControlBtn.className = 'btn-take-control' + (!hasControl && controlAvailable ? ' visible' : '');

    // Waiting list (shown to controller)
    const wl = state.waitingList || [];
    waitingSection.className = 'waiting-section' + (hasControl && wl.length > 0 ? ' visible' : '');
    waitingListEl.innerHTML = wl.map(p => `
      <div class="waiting-item">
        <span class="waiting-item-name ${p.name ? '' : 'unnamed'}">${p.name || 'Unknown device'}</span>
        <button class="btn-pass" data-id="${p.id}">Pass</button>
      </div>
    `).join('');
    waitingListEl.querySelectorAll('.btn-pass').forEach(btn => {
      btn.addEventListener('click', () => {
        send({ type: 'pass_control_to', sessionId, targetId: btn.dataset.id });
      });
    });
  }

  // Duration buttons
  document.querySelectorAll('.dur-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const mins = parseInt(btn.dataset.mins);
      selectedMins = mins;
      document.querySelectorAll('.dur-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      send({ type: 'set_duration', sessionId, seconds: mins * 60 });
    });
  });

  // Custom duration
  document.getElementById('customSetBtn').addEventListener('click', () => {
    const val = parseInt(document.getElementById('customMins').value);
    if (val > 0 && val <= 300) {
      document.querySelectorAll('.dur-btn').forEach(b => b.classList.remove('active'));
      send({ type: 'set_duration', sessionId, seconds: val * 60 });
    }
  });

  // Speaker name (debounced)
  let nameTimer;
  speakerInput.addEventListener('input', () => {
    clearTimeout(nameTimer);
    nameTimer = setTimeout(() => {
      send({ type: 'set_speaker', sessionId, name: speakerInput.value.trim() });
    }, 500);
  });

  // Main control button
  mainBtn.addEventListener('click', () => {
    send({ type: state.running ? 'pause' : 'start', sessionId });
  });

  // Reset
  resetBtn.addEventListener('click', () => {
    send({ type: 'reset', sessionId });
  });

  // Nudge buttons
  document.querySelectorAll('[data-nudge]').forEach(btn => {
    btn.addEventListener('click', () => {
      send({ type: 'nudge', sessionId, delta: parseInt(btn.dataset.nudge) });
    });
  });

  // Waiting name (debounced)
  let waitingNameTimer;
  waitingNameInput.addEventListener('input', () => {
    clearTimeout(waitingNameTimer);
    waitingNameTimer = setTimeout(() => {
      if (waitingId) send({ type: 'set_waiting_name', waitingId, name: waitingNameInput.value.trim() });
    }, 500);
  });

  // Operator message
  const messageInput  = document.getElementById('messageInput');
  const sendMsgBtn    = document.getElementById('sendMsgBtn');
  const clearMsgBtn   = document.getElementById('clearMsgBtn');
  const msgStatus     = document.getElementById('msgStatus');
  const msgStatusText = document.getElementById('msgStatusText');
  const msgBarTrack   = document.getElementById('msgBarTrack');
  const msgBarFill    = document.getElementById('msgBarFill');
  const FLASH_MS      = 5000;
  let msgCountInterval = null;
  let msgCountSecs     = 0;
  let msgDoneTimer     = null;

  function setMsgStatus(type, secs) {
    msgStatus.classList.add('visible');
    clearTimeout(msgDoneTimer);

    if (type === 'displaying') {
      msgStatusText.textContent = `Showing on display — ${secs}s`;
      msgStatusText.className = 'msg-status-text active';
      msgBarTrack.style.display = '';
      msgBarFill.classList.remove('drain');
      msgBarFill.style.setProperty('--d', (FLASH_MS / 1000) + 's');
      void msgBarFill.offsetWidth;
      msgBarFill.classList.add('drain');
    } else if (type === 'autodismissed') {
      msgStatusText.textContent = 'Auto-dismissed ✓';
      msgStatusText.className = 'msg-status-text done';
      msgBarTrack.style.display = 'none';
      msgDoneTimer = setTimeout(() => msgStatus.classList.remove('visible'), 3000);
    } else if (type === 'cleared') {
      msgStatusText.textContent = 'Message cleared ✓';
      msgStatusText.className = 'msg-status-text done';
      msgBarTrack.style.display = 'none';
      msgDoneTimer = setTimeout(() => msgStatus.classList.remove('visible'), 3000);
    }
  }

  function startMsgCountdown() {
    clearInterval(msgCountInterval);
    msgCountSecs = Math.ceil(FLASH_MS / 1000);
    setMsgStatus('displaying', msgCountSecs);
    msgCountInterval = setInterval(() => {
      msgCountSecs--;
      if (msgCountSecs <= 0) {
        clearInterval(msgCountInterval);
        setMsgStatus('autodismissed');
      } else {
        msgStatusText.textContent = `Showing on display — ${msgCountSecs}s`;
      }
    }, 1000);
  }

  sendMsgBtn.addEventListener('click', () => {
    const text = messageInput.value.trim();
    if (!text) return;
    send({ type: 'set_message', sessionId, text });
    messageInput.blur();
    // Button flash
    sendMsgBtn.textContent = '✓ Sent';
    setTimeout(() => { sendMsgBtn.textContent = 'Send to Display'; }, 1500);
  });

  messageInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') sendMsgBtn.click();
  });

  clearMsgBtn.addEventListener('click', () => {
    messageInput.value = '';
    send({ type: 'set_message', sessionId, text: '' });
  });

  // Take control
  takeControlBtn.addEventListener('click', () => {
    controlAvailable = false;
    send({ type: 'claim_control', sessionId });
    render();
  });

  // Release control
  releaseBtn.addEventListener('click', () => {
    send({ type: 'release_control', sessionId });
  });

  // ── WebSocket ──────────────────────────────────────────────────────────────
  let ws, reconnectTimer;

  function send(msg) {
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(msg));
  }

  function connect() {
    try {
      ws = new WebSocket(`${SERVER_URL}?session=${sessionId}&role=control`);
    } catch(e) { scheduleReconnect(); return; }

    ws.onopen = () => {
      overlay.classList.add('hidden');
      connDot.classList.add('live');
    };

    ws.onmessage = (e) => {
      try {
        const msg = JSON.parse(e.data);
        if (msg.type === 'state') {
          const prevMessage = state.message;
          state = { ...state, ...msg.payload };
          if (msg.payload.speakerName !== undefined && document.activeElement !== speakerInput) {
            speakerInput.value = msg.payload.speakerName || '';
          }
          if (msg.payload.message !== undefined && document.activeElement !== messageInput) {
            messageInput.value = msg.payload.message || '';
          }
          // Message status tracking
          if (state.message && state.message !== prevMessage) {
            startMsgCountdown();
          } else if (!state.message && prevMessage) {
            clearInterval(msgCountInterval);
            setMsgStatus('cleared');
          }
          render();
        } else if (msg.type === 'control_granted') {
          hasControl = true;
          waitingId = null;
          controlAvailable = false;
          render();
        } else if (msg.type === 'control_denied') {
          hasControl = false;
          waitingId = msg.waitingId;
          render();
        } else if (msg.type === 'control_available') {
          controlAvailable = true;
          render();
        }
      } catch {}
    };

    ws.onclose = () => {
      overlay.classList.remove('hidden');
      connDot.classList.remove('live');
      hasControl = false;
      controlAvailable = false;
      scheduleReconnect();
    };

    ws.onerror = () => ws.close();
  }

  function scheduleReconnect() {
    clearTimeout(reconnectTimer);
    reconnectTimer = setTimeout(connect, 3000);
  }

  connect();
  render();
</script>
</body>
</html>
